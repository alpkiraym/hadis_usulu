<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hadis Usulü</title>
<meta name="description" content="Hadis usulü için ünite ünite konu anlatımı, kavram kartları, eser–müellif eşleştirme ve açıklamalı testler.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hadis Usulü">
<meta property="og:title" content="Hadis Usulü">
<meta property="og:description" content="Hadis usulü için ünite ünite konu anlatımı, kavram kartları, eser–müellif eşleştirme ve açıklamalı testler.">
<meta property="og:locale" content="tr_TR">
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1f2a24; --muted:#6b7068; --line:#e3dccb;
  --green:#1f5a45; --green-2:#2f7a5f; --green-soft:#e4efe8; --gold:#b08a3e; --gold-soft:#f4ead3;
  --red:#a8432f; --red-soft:#f6e1db; --radius:14px; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:Amiri,"Traditional Arabic","Scheherazade New","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body{padding-bottom:34px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:rgba(247,243,234,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--green);background:none;border:0;padding:0}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#f4c430;display:grid;place-items:center;font-size:1rem}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.ghost:hover{border-color:var(--green-2);color:var(--green)}
.iconbtn{padding:6px 10px;display:inline-grid;place-items:center}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0}
h1{font-size:1.7rem;color:var(--green)}
h2{font-size:1.3rem}
.lead{color:var(--muted);margin:6px 0 0}
.hero{padding:28px 0 8px}
.hero .arn{font-family:var(--ar);font-size:1.5rem;color:var(--gold);margin-top:2px;text-align:left}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--green)}
.stat span{font-size:.8rem;color:var(--muted)}
.section-title{margin:26px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--green-2)}
.mode .ico{font-size:1.4rem;width:40px;height:40px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:10px}
.mode h3{font-size:1.08rem;margin-bottom:4px}
.mode p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.bar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green-2);transition:width .3s}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;background:var(--gold-soft);color:#7a5c1e;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q{font-family:var(--serif);font-size:1.25rem;margin:4px 0 18px}
.q.long{font-family:var(--sans);font-size:1.02rem;line-height:1.6;background:var(--paper);border-radius:12px;padding:12px 14px}
.q em{font-style:normal;color:var(--green);font-weight:700}
.q small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--green-2)}
.opt.ok{border-color:var(--green-2);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--paper);font-size:.93rem;display:none}
.explain.show{display:block}
.explain b{color:var(--green)}
.explain .src{display:block;color:var(--muted);font-size:.82rem;margin-top:6px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center;padding:30px 20px}
.big{font-family:var(--serif);font-size:3rem;color:var(--green);line-height:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.col h4{margin:0 0 2px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.93rem;min-height:52px;transition:all .15s}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.done{border-color:var(--green-soft);background:var(--green-soft);color:var(--green);opacity:.75}
.tile.wrong{animation:shake .3s;border-color:var(--red);background:var(--red-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{perspective:1200px;min-height:280px;cursor:pointer;margin-top:4px}
.flash-in{position:relative;min-height:280px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:#fbf7ec}
.face .t{font-family:var(--serif);font-size:1.5rem;color:var(--green)}
.face .s{color:var(--ink);font-size:.98rem;margin-top:10px;max-width:560px;line-height:1.6}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.answer{display:none;margin-top:6px;border-top:1px dashed var(--line);padding-top:14px}
.answer.show{display:block}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1rem}
.search:focus{outline:none;border-color:var(--green-2)}
.list{margin-top:12px;display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:block}
button.row:hover{border-color:var(--green-2)}
.row .e{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--green)}
.row .n{font-size:.93rem;margin-top:3px;line-height:1.55}
.row .w{font-size:.76rem;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px}
.meter{display:grid;grid-template-columns:minmax(120px,240px) 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.meter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .progress{height:10px}
.select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.9rem;max-width:100%}
.rowctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.foot{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}
.sig{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 12px calc(5px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;letter-spacing:.02em;color:var(--muted)}
.sig b{color:var(--green);font-weight:600}
.sig i{font-style:normal;opacity:.5}
.study-cta{display:flex;gap:14px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:var(--radius);padding:18px;text-align:left;width:100%;box-shadow:var(--shadow);margin-bottom:12px}
.study-cta:hover{background:var(--green-2)}
.study-cta .ico{font-size:1.5rem;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.study-cta h3{font-size:1.15rem;margin-bottom:2px;color:#fff}
.study-cta p{margin:0;opacity:.85;font-size:.9rem}
.ulist{display:grid;gap:8px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.unit:hover{border-color:var(--green-2)}
.unit .st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.unit.done .st{background:var(--green-2);border-color:var(--green-2);color:#fff}
.unit.next .st{border-color:var(--gold);color:var(--gold)}
.unit .ut{flex:1}.unit .ut b{display:block;font-weight:600}.unit .ut small{color:var(--muted)}
.intro{font-size:1.02rem;margin:10px 0 14px}
.tipbox{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.tipbox b.lb{color:#7a5c1e;display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
details.oq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
details.oq summary{cursor:pointer;font-weight:600}
.sticky-go{position:sticky;bottom:40px;display:flex;justify-content:center;margin-top:20px}
.sticky-go .btn{box-shadow:0 6px 20px rgba(31,90,69,.3);padding:11px 20px;font-size:.95rem}
.backlink{background:none;border:0;color:var(--green);font-weight:600;padding:14px 0 0;font-size:.95rem}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.toc button:hover{border-color:var(--green-2);color:var(--green)}
.lesson section.ls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;scroll-margin-top:70px}
.lesson h3{font-family:var(--serif);font-size:1.12rem;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;line-height:1.35}
.lesson h3 .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green);font-family:var(--sans);font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.lesson h4{font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
.lesson p{margin:0 0 8px;font-size:.98rem;line-height:1.65}
.lesson p.li{padding-left:16px;position:relative}.lesson p.li:before{content:"•";position:absolute;left:3px;color:var(--gold);font-weight:700}
.lesson p.num{padding-left:24px;position:relative}.lesson p.num .nn{position:absolute;left:0;color:var(--green);font-weight:700}
.lesson b{color:var(--green)}
.def{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:4px 14px;padding:10px 12px;border-radius:10px;background:var(--green-soft);margin:8px 0}
.def dt{font-family:var(--serif);font-weight:700;color:var(--green)}
.def dd{margin:0;line-height:1.6}
.ar{font-family:var(--ar);font-size:1.18em;line-height:1.9;direction:rtl;unicode-bidi:isolate;color:#5b3f86}
.ar.blk{display:block;text-align:right;margin:4px 0}
.ayet{display:block;font-family:var(--ar);font-size:1.3rem;line-height:2.1;direction:rtl;text-align:right;color:#5b3f86;margin:4px 0 2px}
.sov{position:fixed;inset:0;z-index:90;background:rgba(20,25,20,.35);display:none}
.sov.open{display:block}
.sbox{background:var(--paper);max-width:860px;margin:0 auto;height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.sbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);color:var(--muted)}
.sbar input{flex:1;border:0;background:transparent;font-size:1.05rem;padding:8px 2px;color:var(--ink);outline:none;min-width:0}
.sres{overflow:auto;padding:4px 14px 80px;flex:1}
.sgrp{margin:16px 0 6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.sitem:hover{border-color:var(--green-2)}
.sitem .t{font-weight:600}.sitem .w{font-size:.78rem;color:var(--green);font-weight:600;margin-bottom:2px}
.sitem .x{font-size:.88rem;color:var(--muted);margin-top:3px}
mark{background:#f6df9b;color:inherit;border-radius:3px;padding:0 1px}
.flash-target{animation:ft 2.2s ease}
@keyframes ft{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:none}}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0 14px}
.how summary{cursor:pointer;font-weight:700;color:var(--green);font-family:var(--serif);font-size:1.05rem}
.how .steps{margin:10px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:.94rem}
.how .steps li::marker{color:var(--gold);font-weight:700}
.hownote{margin:6px 0 2px;color:var(--muted);font-size:.86rem}
.exq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.exq .qq{font-family:var(--serif);font-size:1.05rem;font-weight:700;display:flex;gap:10px}
.exq .qq .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:#7a5c1e;font-family:var(--sans);font-size:.8rem;display:grid;place-items:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links button{border:1px solid var(--line);background:var(--green-soft);color:var(--green);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.oralbody{max-height:none}
.sened{font-family:var(--sans);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:14px 0}
.sends{display:flex;justify-content:space-between;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chain{display:flex;align-items:center}
.chain .sn{flex:1 1 0;min-width:0;text-align:center;border-radius:10px;padding:10px 4px;font-size:.88rem;font-weight:600;border:1.5px solid var(--green-2);background:var(--green-soft);color:var(--green)}
.chain .sn.end{border-color:var(--line);background:var(--paper);color:var(--ink)}
.chain .sn.drop{border:1.5px dashed var(--red);background:var(--red-soft);color:var(--red);font-weight:500}
.chain .lk{flex:0 0 18px;height:0;border-top:2.5px solid var(--muted);position:relative}
.chain .lk.cut{border-top:2.5px dashed var(--red)}
.chain .lk.weak{border-top:3px dotted var(--gold);flex-basis:40px}
.chain .lk span{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-family:var(--ar);font-size:1.1rem;color:#5b3f86;line-height:1}
.sendm{display:none;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.sened .sbt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sened .sbt button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:.84rem;color:var(--ink)}
.sened .sbt button.on{background:var(--green);border-color:var(--green);color:#fff}
.slegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.78rem;color:var(--muted)}
.slegend i{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:5px}
.scap{margin:12px 0 0;font-size:.95rem;line-height:1.6}
.scap small{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
.scap a{color:var(--green);font-weight:600}
details.harita{margin:14px 0;padding:0;overflow:hidden}
details.harita summary{cursor:pointer;padding:14px 16px;font-family:var(--serif);font-weight:700;color:var(--green);font-size:1.05rem}
details.harita summary small{display:block;font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px}
details.harita .hb{padding:0 16px 14px}
.sened.inl{margin:-2px 0 10px;padding:10px 12px;background:#fff;box-shadow:none}
.sened.inq{margin:0 0 6px;padding:12px}
.snote{font-size:.86rem;color:var(--muted);margin-top:8px;font-family:var(--sans)}
.hide{display:none!important}
@media (max-width:560px){
  .brand{font-size:1.02rem}.lg{display:none}
  h1{font-size:1.4rem}.q{font-size:1.12rem}.card{padding:16px}
  .meter{grid-template-columns:110px 1fr 44px}
  .tile{font-size:.86rem;padding:9px 10px}
  .def{grid-template-columns:1fr}
  .lesson section.ls{padding:14px}
  .chain{flex-direction:column;align-items:stretch}
  .chain .sn{flex:none;padding:8px}
  .chain .lk{flex:none;height:14px;width:0;border-top:0!important;border-left:2.5px solid var(--muted);align-self:center}
  .chain .lk.cut{border-left:2.5px dashed var(--red)}
  .chain .lk.weak{border-left:3px dotted var(--gold);height:30px}
  .chain .lk span{left:12px;bottom:auto;top:4px;transform:none}
  .sened.inl .sn{padding:4px;font-size:.8rem;border-radius:8px}
  .sened.inl .lk{height:8px}
  .sened.inl .lk.weak{height:22px}
  .sened.inl .sends,.sened.inl .sendm{font-size:.68rem}
  .sends .dk{display:none}
  .sendm{display:block}
  .toc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .toc button{flex:none}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" onclick="go('home')"><span class="mark" title="Tarak tamga"><svg viewBox="24 22 152 96" width="22" height="14" aria-hidden="true" fill="currentColor"><rect x="45" y="33" width="112" height="12"/><rect x="45" y="33" width="12" height="62"/><rect x="28" y="80" width="29" height="15"/><rect x="145" y="33" width="12" height="62"/><rect x="145" y="80" width="27" height="15"/><rect x="97" y="33" width="13" height="70"/><rect x="77" y="97" width="53" height="15"/></svg></span>Hadis Usulü</button>
  <div class="spacer"></div>
  <button class="ghost iconbtn" title="Ara" aria-label="Ara" onclick="openSearch()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
  <button class="ghost hide" id="backBtn" onclick="goBack()">←<span class="lg"> Geri</span></button>

<script>
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’'ʿʾ‘`"]/g, '').replace(/ı/g, 'i').replace(/[^a-z0-9؀-ۿ ]/g, ' ').replace(/\s+/g, ' ').trim();
const plain = s => String(s).replace(/\*\*/g, '').replace(/[«»]/g, '');
// Metin biçimi: **kalın**, «Arapça»
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/«([^»]+)»/g, (m, a) => /[؀-ۿ]/.test(a) ? `<span class="ar" dir="rtl" lang="ar">${a}</span>` : `«${a}»`);
}

/* ---------- kalıcı durum (tarayıcıda, ön ek: hu_) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('hu_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hu_' + k, JSON.stringify(v)); } catch (e) {} }
};
let stats = store.get('stats', {});   // anahtar -> {ok, bad}
let boxes = store.get('boxes', {});   // tanım id -> kutu 1..5
let oral  = store.get('oral', {});    // bölüm anahtarı -> 1/0
let uStat = store.get('units', {});   // ünite -> en iyi mini test (0-5)
function record(key, ok) { const s = stats[key] || {ok: 0, bad: 0}; ok ? s.ok++ : s.bad++; stats[key] = s; store.set('stats', stats); }

/* ---------- veri hazırlığı ---------- */
const TANIM = [], ESER = [], BOLUM = [];
UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
  BOLUM.push({u: ui, s: si, h: s.h});
  s.b.forEach(b => {
    if (b.k === 'd') TANIM.push({id: TANIM.length, u: ui, s: si, t: b.t, x: b.x});
    if (b.k === 'li' || b.k === 'n') {
      const m = b.x.match(/^\*\*(.+?)\*\*\s*→\s*(.+)$/);
      if (m) ESER.push({u: ui, s: si, e: m[1].replace(/\s*\(.*\)$/, ''), m: m[2].replace(/\s*\(.*$/, '').trim(), not: (m[2].match(/\((.*)\)/) || [])[1] || ''});
    }
  });
}));
// Aynı adla birden çok müellife bağlanan eserler soru üretiminde kullanılmaz (Müsned, Musannef, el-Merâsîl…)
const eserSay = {}; ESER.forEach(r => { const k = norm(r.e); (eserSay[k] ||= new Set()).add(norm(r.m)); });
const ESER_Q = ESER.filter(r => eserSay[norm(r.e)].size === 1 && !/^Kütüb/.test(r.e)).filter((r, i, a) => a.findIndex(x => norm(x.e) === norm(r.e)) === i);
ESER_Q.forEach((r, i) => r.id = i);
const GECME = 4;

/* ---------- sened şeridi: kopukluk türleri ---------- */
const SN_AD = ['Musannif', 'Hocası', 'Ravi', 'Tabiîn', 'Sahabe', 'Hz. Peygamber'];
const SENED = {
  muttasil: {ad: 'Muttasıl', d: [], w: null, u: 6, h: 'Muttasıl Hadis', c: 'Senedin başından sonuna kadar hiçbir ravi düşmemiş.', k: 'Sahih ve hasenin şartıdır; fakat muttasıl hadis sahih, hasen ve zayıf olabilir.'},
  mursel: {ad: 'Mürsel', d: [4], w: null, u: 7, h: 'Mürsel Hadis', c: 'Tabiîn, vasıtayı zikretmeksizin hadisi Efendimiz\'e isnad ediyor.', k: 'Kopukluk senedin sonunda, sahabe halkasında.'},
  munkati: {ad: 'Munkatı', d: [[2], [3]], w: null, u: 7, h: 'Munkatı Hadis', c: 'Sahabeden önce, düştüğü yerde sadece bir ravi düşmüş.', k: 'Senedden düşen kişinin durumu bilinmediği için zayıftır.'},
  mudal: {ad: "Mu'dal", d: [2, 3], w: null, u: 7, h: "Mu'dal Hadis", c: 'Senedinde peşpeşe iki veya daha fazla ravi düşmüş.', k: 'Munkatıdan daha düşük derecededir; hüccet değeri yoktur.'},
  muallak: {ad: 'Muallak', d: [1], w: null, u: 7, h: 'Muallak Hadis', c: 'Senedin baş tarafından ravi düşmüş: musannif kendi hocasını zikretmiyor.', k: 'Ravinin durumu bilinmediği için zayıftır, munkatı hükmündedir.'},
  ikisi: {ad: "Hem mu'dal hem muallak", d: [1, 2], w: null, u: 7, h: 'Muallak Hadis', c: 'Senedin başından iki ravi peşpeşe düşmüş.', k: "Senedin başından iki veya daha fazla düşerse hem mu'dal hem muallaktır."},
  hafi: {ad: 'Mürsel-i hafî', d: [], w: 2, u: 8, h: 'Mürsel-i Hafî', c: 'Ravi, muasır olup likâ olmayan veya likâ olsa bile semâ olmayan kişiden rivayet ediyor.', k: 'Halkalar yerinde görünür ama bağ kopuktur. Munkatıdan farkı: ravi ile rivayet ettiği kişi muasırdır.', n: 'Ravi ile tabiîn aynı asırda yaşamış; fakat ravi ondan hiçbir şey işitmemiş.'},
  tedlis: {ad: 'Tedlis (müdelles)', d: [], w: 2, ar: 'عن', u: 8, h: "Tedlîsü'l-İsnâd", c: 'Ravi, likâ ve semâ ettiği hocasından işitmediği bu hadisi, işitmiş gibi vehmettiren lafızla aktarıyor.', k: 'Mürsel-i hafîden farkı: müdellis o kişiden başka hadisler işitmiştir.', n: 'Ravi bu tabiînle karşılaşmış ve ondan hadis işitmiş; ama bu hadisi ondan işitmemiş.'}
};
const SN_TUR = Object.keys(SENED);
function snDrop(t) { const d = SENED[t].d; return Array.isArray(d[0]) ? d[Math.floor(Math.random() * d.length)] : d; }
function chainHTML(t, drop) {
  const s = SENED[t]; drop = drop || snDrop(t);
  let h = '';
  SN_AD.forEach((ad, i) => {
    const dr = drop.includes(i), end = i === 0 || i === 5;
    h += `<div class="sn ${dr ? 'drop' : end ? 'end' : ''}">${dr ? 'düştü' : ad}</div>`;
    if (i < 5) {
      const cut = drop.includes(i) || drop.includes(i + 1), weak = s.w === i;
      h += `<div class="lk ${weak ? 'weak' : cut ? 'cut' : ''}">${weak && s.ar ? `<span lang="ar">${s.ar}</span>` : ''}</div>`;
    }
  });
  return `<div class="sends"><span>Senedin başı</span><span class="dk">Senedin sonu</span></div><div class="chain">${h}</div><div class="sendm">Senedin sonu</div>`;
}
function snSec(t) { const s = SENED[t]; return UNITELER[s.u].s.findIndex(x => x.h === s.h); }
// Tanımın altına konacak sabit şerit: tanım adı → tür
const SN_TANIM = {'Muttasıl Hadis': 'muttasil', 'Mürsel Hadis': 'mursel', 'Munkatı Hadis': 'munkati', "Mu'dal Hadis": 'mudal', 'Muallak Hadis': 'muallak', 'Mürsel-i Hafî': 'hafi', "Tedlîsü'l-İsnâd": 'tedlis'};
function snInline(t) {
  const s = SENED[t], d = Array.isArray(s.d[0]) ? s.d[0] : s.d;
  return `<div class="sened inl">${chainHTML(t, d)}${s.n ? `<div class="snote">${esc(s.n)}</div>` : ''}</div>`;
}
const SN_HARITA = 7;   // 8. ünitenin sonunda
const SN_LEG = `<div class="slegend"><span><i style="border-top:2.5px solid var(--muted)"></i>Sağlam bağ</span><span><i style="border-top:2.5px dashed var(--red)"></i>Düşen ravi</span><span><i style="border-top:3px dotted var(--gold)"></i>Görünürde var, işitme yok</span></div>`;
function haritaHTML() {
  return `<details class="sened harita" id="snbox"><summary>Özet: kopukluk haritası<small>Türleri yan yana karşılaştır: kopukluk senedin neresinde?</small></summary><div class="hb">
    <div class="sbt">${SN_TUR.map(k => `<button data-t="${k}" onclick="snShow('${k}')">${SENED[k].ad}</button>`).join('')}</div>
    <div id="snch"></div>${SN_LEG}<p class="scap" id="sncap"></p>
    <div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="btn sec" onclick="quiz({keys:SN_TUR.filter(k => k !== 'muttasil').map(k => 's:' + k)})">Kopukluğu bul: alıştırma →</button></div></div></details>`;
}
function snShow(t) {
  const s = SENED[t], sec = snSec(t);
  $('#snch').innerHTML = chainHTML(t, Array.isArray(s.d[0]) ? s.d[0] : s.d);
  $('#sncap').innerHTML = `<b>${esc(s.ad)}:</b> ${esc(s.c)}<small>${esc(s.k)}${sec >= 0 ? ` · <a href="#" onclick="event.preventDefault();toSection(${s.u},${sec})">Ünite ${s.u + 1}: ${esc(s.h)}</a>` : ''}</small>`;
  document.querySelectorAll('#snbox .sbt button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
}
function qSened(t) {
  const s = SENED[t];
  const dis = shuffle(SN_TUR.filter(k => k !== t)).slice(0, 3);
  return {key: 's:' + t, u: s.u, s: snSec(t) >= 0 ? snSec(t) : undefined,
    soru: `<small>Kopukluğu bul: bu senedin türü nedir?</small><div class="sened inq">${chainHTML(t)}${s.n ? `<div class="snote">${esc(s.n)}</div>` : ''}</div>`,
    dogru: s.ad, sec: shuffle([s.ad, ...dis.map(k => SENED[k].ad)]), aciklama: `<b>${esc(s.ad)}:</b> ${esc(s.c)} ${esc(s.k)}`};
}
const uDone = () => UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;

/* ---------- soru üretici ---------- */
// Havuz öğesi: {key, u, make()}
const maskTerm = (x, t) => {
  let out = x;
  t.replace(/\(.*?\)/g, '').split(/[\s\-–]+/).filter(w => w.length > 3 && !/^(hadis|hadisi)$/i.test(w)).forEach(w => {
    out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '…');
  });
  return out;
};
function pickDistinct(cands, n, keyFn, exclude) {
  const seen = new Set(exclude.map(keyFn)), out = [];
  for (const c of cands) { const k = keyFn(c); if (!seen.has(k)) { seen.add(k); out.push(c); if (out.length === n) break; } }
  return out;
}
const nearFirst = (list, u) => [...shuffle(list.filter(x => x.u === u)), ...shuffle(list.filter(x => Math.abs(x.u - u) <= 2 && x.u !== u)), ...shuffle(list.filter(x => Math.abs(x.u - u) > 2))];
function qTanim(d) {
  const tersi = Math.random() < 0.65;
  const fk = x => norm(x.t);
  if (tersi) {   // tanımı göster, kavramı sor
    const metin = maskTerm(d.x, d.t);
    const cands = nearFirst(TANIM.filter(x => x.id !== d.id && !norm(d.x).includes(norm(x.t))), d.u);
    const dis = pickDistinct(cands, 3, fk, [d]);
    return {key: 'd:' + d.id, u: d.u, s: d.s, long: true, soru: `<small>Aşağıdaki tanım hangi kavrama aittir?</small>${fmt(metin)}`, dogru: d.t, sec: shuffle([d.t, ...dis.map(x => x.t)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
  }
  const cands = nearFirst(TANIM.filter(x => x.id !== d.id && norm(x.x) !== norm(d.x)), d.u);
  const dis = pickDistinct(cands, 3, x => norm(x.x).slice(0, 60), [d]);
  const kisalt = x => plain(maskTerm(x.x, x.t));
  return {key: 'd:' + d.id, u: d.u, s: d.s, soru: `<small>Hangisi bu kavramın tanımıdır?</small><em>${fmt(d.t)}</em>`, dogru: kisalt(d), sec: shuffle([kisalt(d), ...dis.map(kisalt)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
}
function qEser(r) {
  const cands = nearFirst(ESER.filter(x => norm(x.m) !== norm(r.m)), r.u);
  const dis = pickDistinct(cands, 3, x => norm(x.m), [r]);
  return {key: 'e:' + r.id, u: r.u, s: r.s, soru: `<em>${fmt(r.e)}</em> kimin eseridir?`, dogru: r.m, sec: shuffle([r.m, ...dis.map(x => x.m)]), aciklama: `<b>${fmt(r.e)}</b> → ${fmt(r.m)}${r.not ? ` (${fmt(r.not)})` : ''}`};
}
function qEl(i) {
  const q = SORULAR[i];
  return {key: 'q:' + i, u: q.u, soru: fmt(q.q), dogru: q.a[0], sec: shuffle(q.a), aciklama: fmt(q.x)};
}
const HAVUZ = [
  ...SORULAR.map((q, i) => ({key: 'q:' + i, u: q.u, make: () => qEl(i)})),
  ...TANIM.map(d => ({key: 'd:' + d.id, u: d.u, make: () => qTanim(d)})),
  ...ESER_Q.map(r => ({key: 'e:' + r.id, u: r.u, make: () => qEser(r)})),
  ...SN_TUR.filter(k => k !== 'muttasil').map(k => ({key: 's:' + k, u: SENED[k].u, make: () => qSened(k)}))
];
function weightedPick(list, n) {
  const w = list.map(x => { const s = stats[x.key]; return s ? 1 + s.bad * 2 - s.ok * .5 : 1.5; });
  const out = [], used = new Set();
  while (out.length < Math.min(n, list.length)) {
    let tot = 0; list.forEach((x, i) => { if (!used.has(i)) tot += Math.max(w[i], .2); });
    let rnd = Math.random() * tot;
    for (let i = 0; i < list.length; i++) { if (used.has(i)) continue; rnd -= Math.max(w[i], .2); if (rnd <= 0) { used.add(i); out.push(list[i]); break; } }
  }
  return out;
}

/* ---------- yönlendirme ---------- */
const VIEWS = () => ({home, quiz, match, flash, oralView, browse, progress, study, unitView, exam});
let curView = 'home', curArg = null;
const navStack = [{view: 'home', arg: null}];
let pendingFocus = null;
function render(view, arg) {
  curView = view; curArg = arg ?? null;
  $('#backBtn').classList.toggle('hide', view === 'home');
  window.scrollTo(0, 0);
  VIEWS()[view](arg ?? undefined);
  if (pendingFocus) { const f = pendingFocus; pendingFocus = null; setTimeout(() => focusHit(f), 30); }
}
function go(view, arg) {
  const d = (history.state && history.state.d) || 0;
  const st = {view, arg: arg === undefined ? null : arg};
  if (curView === 'quiz' && view !== 'quiz') { st.d = d; navStack[d] = st; try { history.replaceState(st, ''); } catch (e) {} }
  else { st.d = d + 1; navStack.length = d + 1; navStack.push(st); try { history.pushState(st, ''); } catch (e) {} }
  render(view, arg);
}
function goUp(view, arg = null) {
  const d = (history.state && history.state.d) || 0, key = JSON.stringify(arg);
  for (let k = d - 1; k >= 0; k--) {
    const e = navStack[k];
    if (e && e.view === view && JSON.stringify(e.arg ?? null) === key) { try { history.go(k - d); return; } catch (er) { break; } }
  }
  go(view, arg ?? undefined);
}
function goBack() {
  if (curView === 'unitView') goUp('study');
  else if (curView === 'quiz' && curArg && curArg.unit !== undefined) goUp('unitView', curArg.unit);
  else goUp('home');
}
window.addEventListener('popstate', e => {
  if ($('#sov').classList.contains('open')) { closeSearch(true); return; }
  const st = e.state || {view: 'home', arg: null};
  if (st.search) { try { history.back(); } catch (er) {} return; }
  render(st.view, st.arg);
});

/* ---------- çalış ---------- */
function unitItems(i) { return HAVUZ.filter(x => x.u === i); }
function study() {
  const ilkEksik = UNITELER.findIndex((u, i) => (uStat[i] || 0) < GECME);
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Çalış</h2>
  <p class="lead">Her ünitede önce konu anlatımını oku, sonra ${GECME}/5 ile geçilen mini testi çöz. Geçtiğin üniteler ✓ alır.</p>
  ${ilkEksik >= 0 ? `<div class="actions" style="justify-content:flex-start"><button class="btn" onclick="go('unitView',${ilkEksik})">Kaldığım yerden devam et →</button></div>` : ''}
  <div class="ulist" style="margin-top:16px">${UNITELER.map((u, i) => { const ok = (uStat[i] || 0) >= GECME;
    const nT = TANIM.filter(d => d.u === i).length;
    return `<button class="unit ${ok ? 'done' : i === ilkEksik ? 'next' : ''}" onclick="go('unitView',${i})"><span class="st">${ok ? '✓' : i + 1}</span><span class="ut"><b>${esc(u.t)}</b><small>${u.s.length} bölüm · ${nT} kavram · ${unitItems(i).length} soru${uStat[i] !== undefined ? ` · en iyi: ${uStat[i]}/5` : ''}</small></span><span style="color:var(--muted)">›</span></button>`; }).join('')}</div>`;
}
function blockHTML(b) {
  if (b.k === 'h') return `<h4>${fmt(b.x)}</h4>`;
  if (b.k === 'not') return `<div class="tipbox"><b class="lb">Not</b>${fmt(b.x)}</div>`;
  if (b.k === 'd') return `<dl class="def"><dt>${fmt(b.t)}</dt><dd>${fmt(b.x)}</dd></dl>${SN_TANIM[b.t] ? snInline(SN_TANIM[b.t]) : ''}`;
  if (b.k === 'n') {
    const m = b.x.match(/^(\*\*[^*]+\*\*)\s*«([^»]+)»$/);   // ayet satırı
    if (m) return `<p class="num"><span class="nn">${b.n}.</span>${fmt(m[1])}<span class="ayet" lang="ar">${esc(m[2])}</span></p>`;
    return `<p class="num"><span class="nn">${b.n}.</span>${fmt(b.x)}</p>${/^Eğer senedin başından iki veya daha fazla düşerse hem mu'dal hem muallaktır/.test(b.x) ? snInline('ikisi') : ''}`;
  }
  return `<p class="li">${fmt(b.x)}</p>`;
}
function unitView(i) {
  const u = UNITELER[i], ok = (uStat[i] || 0) >= GECME;
  const kelime = u.s.reduce((t, s) => t + s.b.reduce((a, b) => a + (b.x + ' ' + (b.t || '')).split(/\s+/).length, 0), 0);
  $('#app').innerHTML = `
  <button class="backlink" onclick="goUp('study')">‹ Ünitelere dön</button>
  <div class="bar" style="margin-top:6px"><span class="count">Ünite ${i + 1}/${UNITELER.length} · yaklaşık ${Math.max(2, Math.round(kelime / 180))} dk okuma</span><div class="spacer"></div>${ok ? '<span class="tag" style="margin:0;background:var(--green-soft);color:var(--green)">✓ Tamamlandı</span>' : ''}</div>
  <h2>${esc(u.t)}</h2>
  <p class="intro">${esc(u.intro)}</p>
  ${u.s.length > 3 ? `<div class="toc">${u.s.map((s, k) => `<button onclick="jump('ls-${i}-${k}')">${esc(s.h)}</button>`).join('')}</div>` : ''}
  <div class="lesson">
    ${u.s.map((s, k) => `<section class="ls" id="ls-${i}-${k}"><h3><span class="no">${k + 1}</span>${fmt(s.h)}</h3>${s.b.map(blockHTML).join('')}</section>`).join('')}
  </div>
  ${i === SN_HARITA ? haritaHTML() : ''}
  <div class="actions" style="justify-content:space-between;margin-top:10px">
    ${i > 0 ? `<button class="btn sec" onclick="go('unitView',${i - 1})">‹ Önceki ünite</button>` : '<span></span>'}
    ${i + 1 < UNITELER.length ? `<button class="btn sec" onclick="go('unitView',${i + 1})">Sonraki ünite ›</button>` : ''}
  </div>
  <div class="sticky-go"><button class="btn" onclick="go('quiz',{unit:${i}})">Okudum, mini teste geç →</button></div>`;
  if (i === SN_HARITA) snShow('muttasil');
}
function jump(id) { const el = document.getElementById(id); if (el) { el.scrollIntoView({behavior: 'smooth', block: 'start'}); el.classList.remove('flash-target'); void el.offsetWidth; el.classList.add('flash-target'); } }

/* ---------- test ---------- */
let Q = null;
function quiz(opts = {}) {
  opts = opts || {};
  let kaynak = HAVUZ, adet = opts.adet || 10;
  let ek = [];
  if (opts.unit !== undefined && opts.unit !== null) {
    kaynak = unitItems(opts.unit); adet = 5;
    const sn = kaynak.filter(x => x.key[0] === 's');
    if (sn.length) { ek = weightedPick(sn, 1); kaynak = kaynak.filter(x => x !== ek[0]); adet = 4; }
  }
  if (opts.keys) { kaynak = HAVUZ.filter(x => opts.keys.includes(x.key)); adet = opts.keys.length; }
  Q = {list: shuffle([...ek, ...weightedPick(kaynak, adet)]).map(x => x.make()), i: 0, dogru: 0, yanlis: [], unit: opts.unit};
  if (!Q.list.length) { $('#app').innerHTML = '<p class="empty">Bu seçimde soru yok.</p>'; return; }
  renderQ();
}
function renderQ() {
  const q = Q.list[Q.i];
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * Q.i / Q.list.length}%"></i></div><span class="count">${Q.i + 1} / ${Q.list.length}</span></div>
  <div class="card">
    <span class="tag">Ünite ${q.u + 1} · ${esc(UNITELER[q.u].t)}</span>
    <div class="q${q.long ? ' long' : ''}">${q.soru}</div>
    <div class="opts">${q.sec.map((s, i) => `<button class="opt" data-i="${i}" onclick="answer(this)"><span class="k">${'ABCD'[i]}</span><span>${fmt(s)}</span></button>`).join('')}</div>
    <div class="explain" id="exp"></div>
    <div class="actions"><button class="btn" id="next" disabled onclick="nextQ()">${Q.i + 1 < Q.list.length ? 'Sonraki →' : 'Sonucu gör'}</button></div>
  </div>`;
}
function answer(el) {
  const q = Q.list[Q.i], secilen = q.sec[+el.dataset.i], ok = secilen === q.dogru;
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (q.sec[+b.dataset.i] === q.dogru) b.classList.add('ok'); });
  if (!ok) el.classList.add('bad');
  ok ? Q.dogru++ : Q.yanlis.push(q);
  record(q.key, ok);
  const yer = q.s !== undefined ? `<span class="src">Ünite ${q.u + 1} · ${esc(UNITELER[q.u].s[q.s].h)}</span>` : `<span class="src">Ünite ${q.u + 1} · ${esc(UNITELER[q.u].t)}</span>`;
  $('#exp').innerHTML = `<b>${ok ? 'Doğru.' : 'Yanlış.'}</b> ${q.aciklama}${yer}`;
  $('#exp').classList.add('show');
  $('#next').disabled = false; $('#next').focus();
}
function nextQ() { Q.i++; Q.i < Q.list.length ? renderQ() : quizEnd(); }
function wrongList() {
  const satir = q => q.key[0] === 'q'
    ? `<div class="row"><div class="n" style="color:var(--muted)">${q.soru}</div><div class="n"><b>Doğru cevap:</b> ${fmt(q.dogru)}</div><div class="w">${q.aciklama}</div></div>`
    : `<div class="row"><div class="n">${q.aciklama}</div></div>`;
  return Q.yanlis.length ? `<div class="section-title" style="text-align:left">Yanlış yaptıkların</div><div class="list" style="text-align:left">${Q.yanlis.map(satir).join('')}</div>` : '';
}
function quizEnd() {
  const n = Q.list.length, p = Math.round(100 * Q.dogru / n);
  if (Q.unit !== undefined && Q.unit !== null) {
    const i = Q.unit, gecti = Q.dogru >= GECME;
    uStat[i] = Math.max(uStat[i] || 0, Q.dogru); store.set('units', uStat);
    const sonraki = i + 1 < UNITELER.length ? i + 1 : null;
    $('#app').innerHTML = `
    <div class="card result" style="margin-top:24px">
      <div class="big">${Q.dogru}/${n}</div>
      <p class="lead">${gecti ? '✓ Üniteyi tamamladın.' : `Geçmek için en az ${GECME} doğru gerekiyor. Üniteyi bir kez daha okuyup tekrar dene.`}</p>
      ${wrongList()}
      <div class="actions" style="justify-content:center">
        <button class="btn sec" onclick="go('study')">Ünite listesi</button>
        <button class="btn sec" onclick="go('unitView',${i})">Üniteye dön</button>
        ${gecti && sonraki !== null ? `<button class="btn" onclick="go('unitView',${sonraki})">Sonraki ünite →</button>` : `<button class="btn" onclick="quiz({unit:${i}})">Tekrar dene</button>`}
      </div>
    </div>`;
    return;
  }
  const keys = Q.yanlis.map(q => q.key);
  $('#app').innerHTML = `
  <div class="card result" style="margin-top:24px">
    <div class="big">${Q.dogru}/${n}</div>
    <p class="lead">%${p} başarı · ${p >= 80 ? 'Çok iyi gidiyorsun.' : p >= 50 ? 'Fena değil, yanlışları tekrar et.' : 'Bu konulara biraz daha çalışmak gerekiyor.'}</p>
    ${wrongList()}
    <div class="actions" style="justify-content:center">
      ${keys.length ? `<button class="btn sec" onclick='quiz({keys:${JSON.stringify(keys)}})'>Yanlışları tekrar et</button>` : ''}
      <button class="btn" onclick="quiz()">Yeni test</button>
    </div>
  </div>`;
}

/* ---------- eşleştirme ---------- */
let M = null;
function match() {
  const list = [], mu = new Set();
  for (const r of shuffle(ESER_Q)) { const k = norm(r.m); if (!mu.has(k)) { mu.add(k); list.push(r); } if (list.length === 5) break; }
  M = {list, left: shuffle(list), right: shuffle(list), sel: null, done: new Set(), hata: 0, t0: Date.now()};
  renderM();
}
function renderM() {
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * M.done.size / M.list.length}%"></i></div><span class="count">${M.done.size} / ${M.list.length} · ${M.hata} hata</span></div>
  <p class="lead" style="margin-bottom:12px">Soldan bir eser seç, sonra sağdan müellifine dokun.</p>
  <div class="match">
    <div class="col"><h4>Eser</h4>${M.left.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : M.sel === r.id ? 'sel' : ''}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mSel(${r.id})">${fmt(r.e)}</button>`).join('')}</div>
    <div class="col"><h4>Müellif</h4>${M.right.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : ''}" id="mr-${r.id}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mPick(${r.id})">${fmt(r.m)}</button>`).join('')}</div>
  </div>`;
}
function mSel(id) { M.sel = id; renderM(); }
function mPick(id) {
  if (M.sel === null) return;
  if (M.sel === id) { M.done.add(id); record('e:' + id, true); M.sel = null; renderM(); if (M.done.size === M.list.length) mEnd(); }
  else { M.hata++; record('e:' + M.sel, false); const el = $('#mr-' + id); el.classList.add('wrong'); setTimeout(() => { el.classList.remove('wrong'); $('#app .bar .count').textContent = `${M.done.size} / ${M.list.length} · ${M.hata} hata`; }, 320); }
}
function mEnd() {
  const sn = Math.round((Date.now() - M.t0) / 1000);
  $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">✓</div><p class="lead">${sn} saniyede, ${M.hata} hatayla bitirdin.</p>
  <div class="list" style="text-align:left;margin-top:18px">${M.list.map(r => `<div class="row"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)} · <span style="color:var(--muted)">Ünite ${r.u + 1}</span></div></div>`).join('')}</div>
  <div class="actions" style="justify-content:center"><button class="btn" onclick="match()">Yeni tur</button></div></div>`;
}

/* ---------- kavram kartları (Leitner) ---------- */
let F = null;
function flash(u) {
  const fu = (u === undefined || u === null) ? store.get('flashU', -1) : u;
  store.set('flashU', fu);
  const list = fu >= 0 ? TANIM.filter(d => d.u === fu) : TANIM;
  const sirali = shuffle(list).sort((a, b) => (boxes[a.id] || 0) - (boxes[b.id] || 0)).slice(0, 20);
  F = {list: shuffle(sirali), i: 0, bildim: 0, u: fu};
  renderF();
}
function unitSelect(cur, fn) {
  return `<select class="select" onchange="${fn}(+this.value)"><option value="-1">Bütün üniteler</option>${UNITELER.map((u, i) => `<option value="${i}" ${cur === i ? 'selected' : ''}>${i + 1}. ${esc(u.t)}</option>`).join('')}</select>`;
}
function renderF() {
  const d = F.list[F.i], kutu = boxes[d.id] || 0;
  $('#app').innerHTML = `
  <div class="rowctl">${unitSelect(F.u, 'flash')}</div>
  <div class="bar"><div class="progress"><i style="width:${100 * F.i / F.list.length}%"></i></div><span class="count">${F.i + 1} / ${F.list.length}</span></div>
  <div class="flash" onclick="this.classList.toggle('flip')"><div class="flash-in">
    <div class="face"><span class="tag">Ünite ${d.u + 1}</span><div class="t">${fmt(d.t)}</div><div class="s" style="color:var(--muted)">Tanımı nedir?</div><div class="hint">Çevirmek için dokun · kutu ${kutu}/5</div></div>
    <div class="face back"><div class="t" style="font-size:1.15rem">${fmt(d.t)}</div><div class="s">${fmt(d.x)}</div></div>
  </div></div>
  <div class="actions" style="justify-content:center">
    <button class="btn red" onclick="fAns(false)">Bilemedim</button>
    <button class="btn" onclick="fAns(true)">Bildim</button>
  </div>`;
}
function fAns(ok) {
  const d = F.list[F.i];
  boxes[d.id] = ok ? Math.min((boxes[d.id] || 0) + 1, 5) : 1; store.set('boxes', boxes);

  else $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">${F.bildim}/${F.list.length}</div><p class="lead">Deste bitti. Bilemediklerin bir sonraki destede önce gelecek.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="flash()">Yeni deste</button></div></div>`;
}

/* ---------- konu tekrarı ---------- */
let O = null;
const bKey = b => b.u + '-' + b.s;
function oralView(u) {

  const sirali = shuffle(list).sort((a, b) => (oral[bKey(a)] ?? -1) - (oral[bKey(b)] ?? -1));

}

  <div class="rowctl">${unitSelect(O.u, 'oralView')}</div>

  <div class="card">
    <span class="tag">Ünite ${b.u + 1} · ${esc(UNITELER[b.u].t)}${d === 1 ? ' · daha önce bildin' : d === 0 ? ' · daha önce bilemedin' : ''}</span>
    <div class="q">${fmt(s.h)}</div>

}

}

/* ---------- ilerleme ---------- */
function progress() {
  const satir = UNITELER.map((u, i) => {
    let ok = 0, bad = 0; unitItems(i).forEach(x => { const s = stats[x.key]; if (s) { ok += s.ok; bad += s.bad; } });
    const p = ok + bad ? Math.round(100 * ok / (ok + bad)) : null;
    return `<div class="meter"><span title="${esc(u.t)}">${i + 1}. ${esc(u.t)}</span><div class="progress"><i style="width:${p ?? 0}%;background:${p === null ? 'transparent' : p >= 70 ? 'var(--green-2)' : p >= 45 ? 'var(--gold)' : 'var(--red)'}"></i></div><span class="count">${p === null ? '—' : '%' + p}</span></div>`;
  }).join('');
  const byKey = {}; HAVUZ.forEach(x => byKey[x.key] = x);
  const zayif = Object.entries(stats).filter(([k, s]) => s.bad > 0 && byKey[k]).sort((a, b) => (b[1].bad - b[1].ok * .5) - (a[1].bad - a[1].ok * .5)).slice(0, 12).map(([k]) => k);
  const etiket = k => { const [t, id] = k.split(':');
    if (t === 'd') return `<b>${fmt(TANIM[id].t)}</b>: ${fmt(TANIM[id].x)}`;
    if (t === 's') return `Kopukluğu bul: <b>${esc(SENED[id].ad)}</b> · ${esc(SENED[id].c)}`;
    if (t === 'e') return `<b>${fmt(ESER_Q[id].e)}</b> → ${fmt(ESER_Q[id].m)}`;
    return `${fmt(SORULAR[id].q)} <b>${fmt(SORULAR[id].a[0])}</b>`; };
  const oralN = Object.keys(oral).length, oralOk = Object.values(oral).filter(v => v === 1).length;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">İlerlemem</h2>
  <div class="card" style="margin-top:14px">${satir}
    <p class="lead" style="font-size:.88rem;margin-top:12px">Çalış bölümü: ${uDone()} / ${UNITELER.length} ünite tamamlandı.<br>Konu tekrarı: ${oralN} bölüm çalışıldı, ${oralOk} tanesini bildin.</p></div>
  <div class="section-title">En çok karıştırdıkların</div>
  ${zayif.length ? `<div class="list">${zayif.map(k => `<div class="row"><div class="n">${etiket(k)}</div></div>`).join('')}</div>
    <div class="actions"><button class="btn" onclick='quiz({keys:${JSON.stringify(zayif)}})'>Bunlarla test çöz</button></div>` : '<p class="empty">Henüz yanlış yok. Biraz test çözünce burada görünecek.</p>'}
  <div class="actions" style="margin-top:30px"><button class="btn sec" onclick="sifirla()">İlerlemeyi sıfırla</button></div>`;
}
function sifirla() {
  if (!confirm('Bütün ilerleme kaydın silinsin mi?')) return;
  stats = {}; boxes = {}; oral = {}; uStat = {};
  store.set('stats', stats); store.set('boxes', boxes); store.set('oral', oral); store.set('units', uStat); progress();
}

let SIDX = null;
function buildIndex() {

  UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
    SIDX.push({u: ui, s: si, kind: 'b', t: s.h, x: s.b.map(b => plain((b.t ? b.t + ': ' : '') + b.x)).join(' · ')});
  }));
}
function openSearch() {
  if (!SIDX) buildIndex();
  $('#sov').classList.add('open');
  try { history.pushState(Object.assign({}, history.state, {search: true}), ''); } catch (e) {}
  $('#sq').value = ''; doGlobalSearch(); setTimeout(() => $('#sq').focus(), 30);
}
function closeSearch(viaPop) {
  $('#sov').classList.remove('open');
  if (!viaPop && history.state && history.state.search) { try { history.back(); } catch (e) {} }
}
function markText(text, t) {
  const n = norm(text); const i = n.indexOf(t);
  if (!t || i < 0) return esc(text.slice(0, 160)) + (text.length > 160 ? '…' : '');
  // norm uzunluğu yaklaşık korunduğundan konuma yakın bir pencere al
  const a = Math.max(0, i - 60), b = Math.min(text.length, i + t.length + 100);
  return (a ? '…' : '') + esc(text.slice(a, b)) + (b < text.length ? '…' : '');
}
function doGlobalSearch() {
  const t = norm($('#sq').value || '');
  if (t.length < 2) { $('#sres').innerHTML = '<p class="empty">En az iki harf yaz.</p>'; return; }
  const kav = TANIM.filter(d => norm(d.t).includes(t)).slice(0, 12);
  const bol = SIDX.filter(r => norm(r.t + ' ' + r.x).includes(t)).slice(0, 30);
  $('#sres').innerHTML = (kav.length ? `<div class="sgrp">Kavramlar</div>${kav.map(d => `<button class="sitem" onclick="hit(${d.u},${d.s})"><div class="w">Ünite ${d.u + 1}</div><div class="t">${fmt(d.t)}</div><div class="x">${esc(plain(d.x).slice(0, 140))}</div></button>`).join('')}` : '')
    + (bol.length ? `<div class="sgrp">Konu anlatımları</div>${bol.map(r => `<button class="sitem" onclick="hit(${r.u},${r.s})"><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].t)}</div><div class="t">${esc(r.t)}</div><div class="x">${markText(r.x, t)}</div></button>`).join('')}` : '')
    || '<p class="empty">Sonuç yok.</p>';
}
function hit(u, s) { $('#sov').classList.remove('open'); pendingFocus = {id: `ls-${u}-${s}`}; if (history.state && history.state.search) { try { history.replaceState({view: curView, arg: curArg, d: (history.state.d || 0)}, ''); } catch (e) {} } go('unitView', u); }
function focusHit(f) { jump(f.id); }

/* ---------- başlat ---------- */
try { history.replaceState({view: 'home', arg: null, d: 0}, ''); } catch (e) {}
render('home');
</script>
