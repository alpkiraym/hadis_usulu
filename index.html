<script>
const UNITELER = [{"t":"Hadis İlminin Doğuşu ve Gelişimi","intro":"Hadislerin yazıya geçirilmesinin merhaleleri ve hadis usulü ilminin sahabeden günümüze gelişimi, her dönemin temel eserleri.","s":[{"h":"Hadis usulünün tanımı","b":[{"k":"d","t":"Hadis Usulü","x":"Rivayetin adabını ve onu anlamanın keyfiyetini bilmeye ulaştıran; hadisin makbulünü merdudundan ayırt eden kanun ve kaideleri bir araya getirmektir."}]},{"h":"Merhaleler: Hıfz Dönemi","b":[{"k":"li","x":"Hz. Peygamber, Râşid halifeler ve Emevi dönemi başlangıcını kapsar."},{"k":"h","x":"Kitabet olmamasının sebepleri"},{"k":"n","n":1,"x":"Arapların ümmi bir toplum olması"},{"k":"n","n":2,"x":"Yazım araç-gereçlerinin az olması"},{"k":"n","n":3,"x":"Kur'an'a vermiş oldukları önem"},{"k":"n","n":4,"x":"Kur'an ile karışma durumu olmasın diye Peygamber Efendimizin yazımı yasaklaması"}]},{"h":"Merhaleler: Tedvin Dönemi","b":[{"k":"li","x":"Hicri 2. yy'da başlamıştır."},{"k":"li","x":"Süreci **Ömer b. Abdülaziz** başlatmıştır."},{"k":"li","x":"Hadisleri ilk yazıya geçiren **İbn Şihab ez-Zührî**'dir."},{"k":"li","x":"Merfu, mevkuf, maktu olarak kaleme alındı."},{"k":"h","x":"Eserler (Ale'l-ebvab şeklinde)"},{"k":"n","n":1,"x":"**Muvatta** → İmam Malik"},{"k":"n","n":2,"x":"**Musannef** → İbn Ebi Şeybe"},{"k":"n","n":3,"x":"**Musannef** → Abdurrezzak b. Hemmam b. Nafi"}]},{"h":"Merhaleler: Tecrid Dönemi","b":[{"k":"li","x":"Merfu hadisler ön plana çıkıyor."},{"k":"li","x":"Hicri 3. yy'da başlayıp 4. asra kadar devam ediyor."},{"k":"li","x":"Hadisler kategorize ediliyor."},{"k":"li","x":"En eski müsned **Ebu Davud et-Tayalisi**'nin müsnedidir."},{"k":"h","x":"Eserler"},{"k":"n","n":1,"x":"**Müsned** → Ebu Davud et-Tayalisi"},{"k":"n","n":2,"x":"**Müsned** → Ahmed b. Hanbel"},{"k":"n","n":3,"x":"**Kütüb-i Sitte**"}]},{"h":"Merhaleler: Tertip ve Tehzip Dönemi (Tasnif)","b":[{"k":"li","x":"Hicri 4. asırdan günümüze kadar devam eder."},{"k":"li","x":"Bu dönemde cami ve sünen isimli eserler kaleme alınmıştır."},{"k":"li","x":"Klasik eserlere şerh ve haşiyeler yazılmıştır."},{"k":"h","x":"Eserler"},{"k":"n","n":1,"x":"**Câmiu'l-Usûl** → İbnü'l-Esîr el-Cezerî"},{"k":"n","n":2,"x":"**Tuhfetü'l-Eşrâf** → Mizzî"},{"k":"n","n":3,"x":"**Mecmau'z-Zevâid** → Heysemî"}]},{"h":"Usul ilminin gelişimi: Sahabeler","b":[{"k":"li","x":"Hadislerin rivayet ve nakilleri esnasında Kur'an'ın metodunu tatbik ederlerdi. Bunlar:"},{"k":"n","n":1,"x":"Kizbin haram oluşu"},{"k":"n","n":2,"x":"Fasığın getirdiği haberin reddedilmesi"},{"k":"n","n":3,"x":"Her hükmün iyice araştırılması"},{"k":"n","n":4,"x":"Tekzip edilen haberin nakledilmesinin haram oluşu"},{"k":"li","x":"Sahabe ve ondan sonra gelen tabiinin büyükleri hadisleri rivayet ve aktarma hususunda bu kurallar üzerine devam ettiler."},{"k":"not","x":"Bu kuralların yazılı olduğu ilk eser **İmam Şâfiî'nin \"Risâle\"**sidir."}]},{"h":"Mütekaddimûn Dönemi","b":[{"k":"li","x":"Hadis usulü olarak yazılan ilk müstakil eser **Râmhürmüzî**'nin **el-Muhaddisü'l-Fâsıl beyne'r-Râvî ve'l-Vâî** adlı eseridir."},{"k":"li","x":"Bu dönemin diğer önemli eserleri:"},{"k":"n","n":1,"x":"**Ma'rifetü Ulûmi'l-Hadîs** → Hâkim en-Nîsâbûrî (52 ana başlık altında)"},{"k":"n","n":2,"x":"**Müstahrec** → Ebû Nuaym el-İsfahânî (Hâkim en-Nîsâbûrî'nin eserine ilave)"},{"k":"n","n":3,"x":"**el-Kifâye fî İlmi'r-Rivâye** → Hatîb el-Bağdâdî"}]},{"h":"Müteahhirûn Dönemi","b":[{"k":"n","n":1,"x":"**el-İlmâ' fî Zabti'r-Rivâye** → Kadı İyaz"},{"k":"n","n":2,"x":"**Mukaddime** → İbnü's-Salâh (65 başlık altında)"},{"k":"n","n":3,"x":"**Nuhbetü'l-Fiker** → İbn Hacer (Şerhi: Nüzhetü'n-Nazar)"},{"k":"n","n":4,"x":"**el-Menhelü'r-Ravî** → İbn Cemâa"}]},{"h":"Günümüz","b":[{"k":"n","n":1,"x":"**Tevcîhü'n-Nazar ilâ Usûli'l-Eser** → Tâhir el-Cezâirî"},{"k":"n","n":2,"x":"**Kavâidü't-Tahdîs** → Cemâleddin el-Kâsımî"},{"k":"n","n":3,"x":"**el-Menhecü'l-Hadîs fî Ulûmi'l-Hadîs** → Muhammed Semâhî"},{"k":"n","n":4,"x":"**Menhecü'n-Nakd fî Ulûmi'l-Hadîs** → Nureddin Itr"}]}]},{"t":"Temel Kavramlar ve Sünnetin Konumu","intro":"Hadis, sünnet, haber, eser gibi temel terimler; ravi ve muhaddis unvanları; sünnetin Kur'an'a göre konumu ve hüccet oluşunun delilleri.","s":[{"h":"Metne ilişkin kavramlar","b":[{"k":"d","t":"Hadis","x":"Söz, fiil, takrir, yaratılış ve huy itibariyle Allah Rasulü'ne, sahabeye ve tabiine nispet edilen şeyler demektir."},{"k":"d","t":"Sünnet","x":"Sadece Allah Rasulü'ne nispet edilen şeydir."},{"k":"d","t":"Haber","x":"Allah Rasulü'nden başkasına nispet edilen şeydir."},{"k":"d","t":"Eser","x":"Sadece sahabeye nispet edilen şeydir."}]},{"h":"Sened ve metin","b":[{"k":"d","t":"Senet","x":"Metne ulaştıran raviler zinciridir."},{"k":"d","t":"Metin","x":"Senedin kendisinde son bulduğu, hadisin manalarına delalet eden hadis lafızlarıdır."},{"k":"d","t":"İsnâdü'l-Hadis","x":"Sözü söyleyene dayandırmaktır."},{"k":"d","t":"Müsnid","x":"Rivayet eden kişinin kendisi, ravi (Buhari, Müslim gibi)."}]},{"h":"Hadisçilerin unvanları","b":[{"k":"d","t":"Ravi","x":"Müsnid olan kişi."},{"k":"d","t":"Muhaddis","x":"Hadis rivayet eden, hadis ilmine vakıf, birçok metin ezberleyip raviler hakkında bilgisi olan kişi."},{"k":"d","t":"Hafız","x":"Bildiği hadisler bilmediği hadislerden fazla olan kişi."},{"k":"d","t":"Hüccet","x":"Muhaddis ve hafızdan üstün, bilmediği hadis nadir olan kişi."},{"k":"d","t":"Hâkim","x":"Rivayet edilen tüm hadisler hakkında detaylı bilgiye sahip kişi."},{"k":"d","t":"Emîrü'l-Mü'minîn","x":"Hadis ilminde muasırlarının üstünlüğünü kabul ettiği kişi."},{"k":"h","x":"Emîrü'l-Mü'minîn unvanını alan bazı muhaddisler"},{"k":"n","n":1,"x":"Süfyan es-Sevrî"},{"k":"n","n":2,"x":"Süfyan b. Uyeyne"},{"k":"n","n":3,"x":"Abdullah b. Mübarek"},{"k":"n","n":4,"x":"Buhari"},{"k":"n","n":5,"x":"Müslim"},{"k":"n","n":6,"x":"Dârekutnî"},{"k":"n","n":7,"x":"İbn Hacer el-Askalânî"}]},{"h":"Rivayet ve dirayet","b":[{"k":"d","t":"Rivâyetü'l-Hadis","x":"Hadisleri rivayet ve o hadisleri doğru bir şekilde zapt etmekle ilgilenir."},{"k":"d","t":"Dirâyetü'l-Hadis","x":"Hadisin sahih ve zayıf; makbul ve merdud oluşu ile ilgilenir."}]},{"h":"Hadis ilminin faydaları","b":[{"k":"n","n":1,"x":"Makbul ve merdud hadislerin bilinip ona göre amel edilmesi"},{"k":"n","n":2,"x":"Müslümanların hadislere olan güvenini pekiştirmesi"},{"k":"n","n":3,"x":"Hadisle iştigal eden kişilerin hadislerle ilgili meleke sahibi olmaları"},{"k":"n","n":4,"x":"Bu usulü geliştiren ve katkı sağlayan âlimlere karşı saygı oluşturması"}]},{"h":"Sünnetin Kur'an'a göre konumu","b":[{"k":"li","x":"**Müekkid**"},{"k":"li","x":"**Mübeyyine**: üç kısma ayrılır → **Müfessire**, **Muhassıs**, **Mukayyid**"},{"k":"li","x":"**Vâdıha (Münşie)**"}]},{"h":"Sünnetin hüccet oluşunun delilleri","b":[{"k":"n","n":1,"x":"**Peygambere imanı emreden ayetler:** «يَا أَيُّهَا الَّذِينَ آمَنُوا آمِنُوا بِاللَّهِ وَرَسُولِهِ وَالْكِتَابِ الَّذِي نَزَّلَ عَلَى رَسُولِهِ وَالْكِتَابِ الَّذِي أَنْزَلَ مِنْ قَبْلُ»"},{"k":"n","n":2,"x":"**Allah'a itaatle beraber Peygambere itaati emreden ayetler:** «قُلْ أَطِيعُوا اللَّهَ وَالرَّسُولَ فَإِنْ تَوَلَّوْا فَإِنَّ اللَّهَ لَا يُحِبُّ الْكَافِرِينَ»"},{"k":"n","n":3,"x":"**Sadece Peygambere itaati emreden ayetler:** «قُلْ إِنْ كُنْتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَاللَّهُ غَفُورٌ رَحِيمٌ»"},{"k":"n","n":4,"x":"**Peygamberi örnek almanın gerekliliğini ifade eden ayetler:** «لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ لِمَنْ كَانَ يَرْجُو اللَّهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللَّهَ كَثِيرًا»"}]}]},{"t":"Ravi Sayısına Göre Hadis: Mütevatir ve Âhad","intro":"Hadisin ravi sayısı bakımından mütevatir ve âhad diye ayrılması; mütevatirin şartları ve kısımları; meşhur, aziz, ferd ve garib hadis.","s":[{"h":"Hadisin taksimi","b":[{"k":"li","x":"Hadis, ravi sayısı bakımından **mütevatir** ve **âhad** olarak ikiye ayrılır."},{"k":"li","x":"Âhad hadis: **garib**, **aziz** ve **müstefiz (meşhur)** kısımlarına ayrılır."}]},{"h":"Mütevatir Hadis","b":[{"k":"d","t":"Mütevatir Hadis","x":"Her tabakada (ilk üç tabaka) sayısı korunmuş, yalan üzere birleşmeleri mümkün olmayan kalabalık bir grup tarafından, duyu organları ile rivayet edilen hadistir."},{"k":"h","x":"Şartları"},{"k":"n","n":1,"x":"Her tabakada tevatür seviyesinde cemaatin bulunması (ilk üç tabaka önemli)"},{"k":"n","n":2,"x":"Ravilerin yalan üzerine birleşmelerinin mümkün olmaması"},{"k":"n","n":3,"x":"Bu cemaatin senedin başından sonuna kadar korunmuş olması"},{"k":"n","n":4,"x":"Haberin hissî olarak isnad edilmesi"},{"k":"h","x":"Kısımları"},{"k":"d","t":"Lafzî Mütevatir","x":"Bütün ravilerin aynı lafzı kullandıkları hadistir. «من كذب عليّ متعمدا فليتبوأ مقعده من النار»"},{"k":"d","t":"Manevî Mütevatir","x":"Lafızları farklı, manaları aynı olan hadislerdir. Hadisler tek tek tevatür değil, manaları aynı olduğu için toplu olarak tevatür sayılır."},{"k":"li","x":"**Manevî mütevatir örneği:** Peygamber Efendimiz'in duada ellerini kaldırması gibi. Sahabe-i kiramdan her biri farklı vakıayı aktarırken ortak payda Hz. Peygamber'in (sav) dua ettiği zaman ellerini kaldırmasıdır."},{"k":"h","x":"Kaynakları"},{"k":"n","n":1,"x":"**Katfu'l-Ezhâri'l-Mütenâsire fi'l-Ahbâri'l-Mütevâtire** → Suyûtî"},{"k":"n","n":2,"x":"**Nazmü'l-Mütenâsir mine'l-Hadîsi'l-Mütevâtir** → Kettânî"},{"k":"not","x":"Âlimlere göre mütevatir hadisin senedi sorgulanmaz ve ricâl bilgisi soruşturulmaz. Bundan dolayı mütevatir hadis mustalahu'l-hadis alanına alınmamıştır."}]},{"h":"Meşhur Hadis","b":[{"k":"d","t":"Meşhur Hadis","x":"Her tabakada en az üç ravisi bulunup tevatür seviyesine ulaşmayan hadis türüdür."},{"k":"li","x":"Bazı muhaddisler bu türe \"müstefiz\" demişlerdir."},{"k":"li","x":"**Hükmü:** Sahih, hasen veya zayıf olabilir. Mahza şöhretinden dolayı bir hadis sahih olmaz."},{"k":"li","x":"Meşhur, yukarıdaki ıstılahi tanımdan farklı olarak \"dillerde meşhur\" («المشهور على الألسنة») olarak da kullanılmıştır. Bu ıstılahi tanımdan daha umumidir."},{"k":"h","x":"Eserler"},{"k":"n","n":1,"x":"**el-Makâsıdü'l-Hasene** → İmam Sehâvî"},{"k":"n","n":2,"x":"**Keşfü'l-Hafâ** → Aclûnî"},{"k":"n","n":3,"x":"**ed-Dürerü'l-Müntesira fi'l-Ehâdîsi'l-Müştehira** → Suyûtî"}]},{"h":"Aziz Hadis","b":[{"k":"d","t":"Aziz Hadis","x":"Her tabakada iki ravi ile sınırlandırılmış olan hadis türüdür."},{"k":"li","x":"Her tabakada illa iki ravi olacak diye bir kaide yoktur. Burada anlaşılması gereken: hadisin herhangi bir tabakasında ravilerinin sayısının iki olması o hadisin aziz olması için yeterlidir."},{"k":"li","x":"Çok az bulunduğu için ya da başka bir tarikle güç kazandığı için aziz diye isimlendirilmiştir."},{"k":"li","x":"**Hükmü:** Sahih, hasen veya zayıf olabilir."}]},{"h":"Ferd Hadis","b":[{"k":"d","t":"Ferd Hadis","x":"Teferrüd vecihlerinden bir vecih ile ravinin rivayetinde teferrüd ettiği hadistir."},{"k":"d","t":"Ferd-i Mutlak","x":"Tek bir ravinin rivayetinde teferrüd ettiği hadistir. Hadis sadece bu ravi üzerinden aktarılmıştır. Bu hem isnat hem de metin yönünden garibtir."},{"k":"d","t":"Ferd-i Nisbî","x":"Belli bir noktadan hareketle tek kalmış, teferrüd etmiş hadistir."},{"k":"h","x":"İbn Hacer ferd-i nisbîyi 4 kısma ayırmıştır"},{"k":"n","n":1,"x":"Bir kişinin bir kişiden teferrüdü (isnad-ı garib bu kısımdır)"},{"k":"n","n":2,"x":"Bir belde ehlinin tek kişiden teferrüdü"},{"k":"n","n":3,"x":"Tek kişinin bir belde ehlinden teferrüdü (çok nadirdir)"},{"k":"n","n":4,"x":"Bir belde ehlinin bir belde ehlinden teferrüdü"}]},{"h":"Garib Hadis","b":[{"k":"d","t":"Garib Hadis","x":"Senedin herhangi bir yerinde tek bir ravinin rivayetinde teferrüd ettiği hadistir."},{"k":"li","x":"Her garib ferddir. Fakat her ferd garib değildir. Ferd daha umumidir."},{"k":"d","t":"Metin ve Senet Olarak Garib","x":"Metnin sadece tek bir ravinin tarikiyle bilinmesidir. Ferd-i mutlak diye de isimlendirilir."},{"k":"d","t":"Sadece İsnat Olarak Garib","x":"Metni birçok sahabiden birçok tarikle bilinmesiyle beraber ravinin başka bir sahabiden rivayetiyle teferrüd etmesidir. Ferd-i nisbînin birinci kısmıdır."},{"k":"not","x":"Ferd veya garib hadis sahih, hasen veya zayıf olabilir."},{"k":"h","x":"Ferd ve garib hadislerin eserleri"},{"k":"n","n":1,"x":"**Müsned** → Ebu Bekir el-Bezzâr"},{"k":"n","n":2,"x":"**el-Mu'cemü'l-Evsat** → Ebu'l-Kâsım et-Taberânî"},{"k":"n","n":3,"x":"**Kitâbü'l-Efrâd** → Dârekutnî"}]}]},{"t":"Sahih Hadis","intro":"Sahih hadisin tanımı, şartları, en sahih senetler, sahih hadis kaynakları (Buhari, Müslim, Müstedrek, İbn Huzeyme, İbn Hibban), müstahrec ve sahihin mertebeleri.","s":[{"h":"Tanım","b":[{"k":"d","t":"Sahih Hadis","x":"Adalet ve zabt sahibi ravilerin kendileri gibi ravilerden muttasıl bir senetle rivayet ettikleri, şaz ve muallel olmayan hadistir."},{"k":"li","x":"**Sahih li-zâtihî** ve **sahih li-ğayrihî** olmak üzere ikiye ayrılır."},{"k":"li","x":"Ravinin zabtında kusur varsa **hasen** derecesine düşer."}]},{"h":"Şartları","b":[{"k":"n","n":1,"x":"Sened muttasıl olacak"},{"k":"n","n":2,"x":"**Adalet** (Adil ravi: Müslüman, akıl-baliğ, büyük günah işlemekten uzak ve küçük günahlarda da ısrar etmeyen, onur kırıcı hal ve hareketlerden uzak duran kişidir.)"},{"k":"n","n":3,"x":"**Zabt** (Hafıza zabtı ve kitapta zabt olarak ikiye ayrılır.)"},{"k":"n","n":4,"x":"Şaz ve muallel olmayacak (Muallel, kendisinde illet-i kâdiha bulunan hadistir.)"}]},{"h":"En sahih senetler","b":[{"k":"n","n":1,"x":"**Ahmed b. Hanbel'e göre:** Zührî – Sâlim b. Abdillah – Abdullah b. Ömer"},{"k":"n","n":2,"x":"**Yahya b. Maîn'e göre:** A'meş – İbrahim b. Yezid – Alkame – Abdullah b. Mes'ud"},{"k":"n","n":3,"x":"**Buhari'ye göre:** Malik b. Enes – Nâfi – Abdullah b. Ömer"}]},{"h":"Kaynakları","b":[{"k":"n","n":1,"x":"Buhari"},{"k":"n","n":2,"x":"Müslim"},{"k":"n","n":3,"x":"Müstedrek"},{"k":"n","n":4,"x":"Sahih-i İbn Huzeyme"},{"k":"n","n":5,"x":"Sahih-i İbn Hibban"},{"k":"n","n":6,"x":"el-Ehâdîsü'l-Muhtâre (Makdisî'nin eseri)"}]},{"h":"Buhari · «الجامع الصحيح المسند المختصر من أمور رسول الله وسننه وأيامه»","b":[{"k":"li","x":"Muhammed b. İsmail Buhari."},{"k":"li","x":"Hadisleri sahih olarak alan ilk kişidir."},{"k":"li","x":"Kitabını 600 bin hadis içerisinden seçerek oluşturmuştur."},{"k":"li","x":"Her hadisin yazımından önce gusül alıp 2 rekat namaz kılmıştır."},{"k":"li","x":"2337 hadis içerir (mükerrerlerle 7123)."}]},{"h":"Müslim · «الجامع الصحيح»","b":[{"k":"li","x":"Müslim b. el-Haccâc en-Nîsâbûrî."},{"k":"li","x":"Buhari'nin öğrencisidir."},{"k":"li","x":"3031 hadis içerir (mükerrerlerle 10.000)."}]},{"h":"Buhari ve Müslim'in birbirine tercih edilme sebepleri","b":[{"k":"n","n":1,"x":"Buhari, Müslim'in hocasıdır."},{"k":"n","n":2,"x":"Buhari'nin şartları daha ağırdır."},{"k":"n","n":3,"x":"Buhari'ye göre \"muanan\" rivayette ravi hocası ile muasır olup karşılaşması gerekir. Müslim'de ise muasır olup karşılaşma ihtimali yeterlidir."},{"k":"n","n":4,"x":"Buhari'de Müslim'e göre tenkide tabi tutulan rivayet ve raviler daha azdır. Tenkide tutulanlar ise genelde Buhari'nin hocalarıdır, Müslim'in ise daha üst tabakadaki ravilerdir."}]},{"h":"Müstedrek","b":[{"k":"li","x":"Önceki bir muhaddisin şartlarına (ravi-sened) uyduğu halde herhangi bir sebeple eserine almadığı hadisleri toplayan eserlerdir."},{"k":"li","x":"En meşhuru **Hâkim en-Nîsâbûrî**'nin Müstedrek isimli eseridir."},{"k":"li","x":"Ancak Hâkim hadis rivayetinde şartlara riayet etme noktasında mütesâhil davrandığı için rivayetleri tenkide tabi tutulmuştur. (Sonra 2. cilde kadar tekrar düzenlemiştir.)"}]},{"h":"Sahih-i İbn Huzeyme","b":[{"k":"li","x":"Küçük bir tereddütte hadise sahih demez."},{"k":"li","x":"Hadisler arasında tearuz yoktur."},{"k":"li","x":"Tearuz diye görülen hadisleri cem etme hususunda özel bir yeteneği vardır."}]},{"h":"Sahih-i İbn Hibban","b":[{"k":"li","x":"Hâkim en-Nîsâbûrî'nin hocasıdır."},{"k":"li","x":"Eserin ismi «التقاسيم والأنواع» (et-Tekâsîm ve'l-Envâ')'dır."},{"k":"not","x":"**Son üç eserin sıralanışı:** İbn Huzeyme'nin Sahihi → İbn Hibban'ın Sahihi → Müstedrek"}]},{"h":"Müstahrec","b":[{"k":"d","t":"Müstahrec","x":"Herhangi bir hadis kitabındaki hadisleri başka senetlerle yeni bir kitapta toplamadır."},{"k":"li","x":"Daha çok Sahihayn üzerine yapılmıştır."},{"k":"h","x":"Faydaları"},{"k":"li","x":"Tarikte çokluk, hadisin kuvvetini ziyade eder."},{"k":"li","x":"Sika ravilerin çok olduğunu ortaya çıkarır."},{"k":"h","x":"Müstahrec yazanlar"},{"k":"li","x":"**Sahihayn üzerine:** Ebu Nuaym el-İsfahânî"},{"k":"li","x":"**Sadece Buhari üzerine:** Ebubekir el-İsmâilî"},{"k":"li","x":"**Sadece Müslim üzerine:** Ebu Avâne el-İsferâyînî"}]},{"h":"Sahih hadisin mertebeleri","b":[{"k":"n","n":1,"x":"Müttefekun aleyh"},{"k":"n","n":2,"x":"Efrâdü'l-Buhârî"},{"k":"n","n":3,"x":"Efrâdü'l-Müslim"},{"k":"n","n":4,"x":"Buhari ve Müslim'in rivayet etmediği ama şartlarına uygun"},{"k":"n","n":5,"x":"Buhari'nin şartlarına uygun"},{"k":"n","n":6,"x":"Müslim'in şartlarına uygun"},{"k":"n","n":7,"x":"Şartlara uygun olmayıp diğer muhaddislerin rivayet ettikleri"}]}]},{"t":"Hasen Hadis","intro":"Hasen hadisin tanımı ve kısımları, en sahih ve en zayıf senetler, hasen hadisin kaynakları (sünenler ve Müsned), Tirmizî'nin \"hasen sahih\" ifadesi ve ilgili terimler.","s":[{"h":"Tanım","b":[{"k":"d","t":"Hasen Hadis","x":"Adil olmakla beraber sahih hadisin ravisine göre zabtı daha hafif olan bir ravinin muttasıl bir senetle rivayet ettiği, şaz ve muallel olmayan hadistir."}]},{"h":"Hasen hadisin kısımları","b":[{"k":"d","t":"Hasen li-zâtihî","x":"Tanımda yer alan şartları kendisinde bulunduran hadis."},{"k":"d","t":"Hasen li-ğayrihî","x":"Rivayet ehliyeti tam olarak tespit edilmemiş, mechul ve mestur olan kişilerden rivayet edilen hadistir. Kısaca zabtında hafif kusur olan ravinin rivayet ettiği hadistir."},{"k":"li","x":"Hasen li-ğayrihîde ravi fazla hata yapmayacak ve yalanla itham edilmeyecek."},{"k":"not","x":"Tirmizî \"Bu hadis hasendir\" dediğinde bu hadis \"hasen li-ğayrihî\"dir."},{"k":"not","x":"Her hadis hasen li-ğayrihî seviyesine çıkmaz. Raviler kizb, fısk, gaflet gibi hallere sahipseler bu ravilerle hadisi desteklemek hadisi daha da zayıf yapar."}]},{"h":"En sahih senetleri","b":[{"k":"n","n":1,"x":"«بهز بن حكيم بن معاوية عن أبيه عن جده»: Behz b. Hâkim – Hâkim b. Muaviye – Muaviye b. Hayde el-Kuşeyrî"},{"k":"n","n":2,"x":"Amr b. Şuayb – Şuayb b. Muhammed – Abdullah b. Amr b. el-Âs"}]},{"h":"En zayıf senetleri","b":[{"k":"li","x":"Haris b. Abdullah el-A'ver, Âsım b. Damra, Haccâc b. Ertât adlı ravilerin bulunduğu senetler zayıftır."}]},{"h":"Kaynakları","b":[{"k":"n","n":1,"x":"Tirmizî, Sünen (el-Câmi)"},{"k":"n","n":2,"x":"Ebu Davud es-Sicistânî, Sünen"},{"k":"n","n":3,"x":"Nesâî, Sünen"},{"k":"n","n":4,"x":"İbn Mâce, Sünen"},{"k":"n","n":5,"x":"Ahmed b. Hanbel, Müsned"},{"k":"li","x":"Dârekutnî ve Beyhakî'nin sünenleri de sayılabilir."}]},{"h":"Tirmizî · Sünen","b":[{"k":"li","x":"Muhammed b. Îsâ."},{"k":"li","x":"Sahih ve zayıf hadisler olsa da hasen hadisin en çok bulunduğu eserdir."},{"k":"li","x":"Hadislerin sahih, hasen ve zayıflık derecelerini beyan eder."},{"k":"li","x":"Zayıflıklarına ve illetlerine işaret eder."},{"k":"li","x":"3956 hadis içerir."}]},{"h":"Ebu Davud · Sünen","b":[{"k":"li","x":"Süleyman b. el-Eş'as."},{"k":"li","x":"Kendi ifadesine göre sahih ve sahihe benzeyen rivayetleri almış ve metruk ravi olmadığını söylemiştir."},{"k":"li","x":"İbnü's-Salâh'a göre hüküm vermediği hadis hasen derecesindedir."},{"k":"li","x":"5270 küsur hadis içerir."}]},{"h":"Nesâî · Sünen","b":[{"k":"li","x":"Ahmed b. Şuayb."},{"k":"li","x":"Eserin ismi el-Müctebâ veya el-Müctenâ'dır."},{"k":"li","x":"Günümüze ulaşmayan es-Sünenü'l-Kübrâ isimli eserinin muhtasarıdır."},{"k":"li","x":"Sadece sahih olan hadisler ve illetine dikkat çekilen illetli hadisler zikredilmiştir."},{"k":"li","x":"Dört sünen içerisinde en az zayıf hadis bulunan eserdir."},{"k":"li","x":"Bab adları babın içeriğine göre konulmuştur."},{"k":"li","x":"5778 küsur hadis içerir."}]},{"h":"İbn Mâce · Sünen","b":[{"k":"li","x":"Muhammed b. Yezid."},{"k":"li","x":"Bablandırılmasının güzelliği ile ön plana çıkar."},{"k":"li","x":"Mütekaddim ulema kaynak nitelikteki hadis kitaplarını; Sahihayn ve diğer üç sünen olarak saymışlardır."},{"k":"li","x":"Müteahhir ulema ise bu kitabı da ekleyerek Kütüb-i Sitte oluşmuştur."},{"k":"li","x":"Sünenler içerisinde zayıf hadisin en çok olduğu eserdir. Bazı metruklar da mevcuttur."},{"k":"li","x":"4340 küsur hadis içerir."}]},{"h":"Ahmed b. Hanbel · Müsned","b":[{"k":"li","x":"Ale'r-ricâl tarzında yazılmıştır."},{"k":"li","x":"40 bin hadis içerir (mükerrerler hariç 27 bin)."},{"k":"li","x":"Ahmed es-Sââtî el-Bennâ fihristini yapmıştır."}]},{"h":"Tirmizî'nin «هذا حديث حسن صحيح» lafzı","b":[{"k":"n","n":1,"x":"**İbnü's-Salâh:** Bir hadise sahih veya hasen denilmesi isnadın durumuyla ilgilidir. Eğer bir hadis iki isnadla/tarikle varid olursa o zaman Tirmizî'nin bu sözü doğru olur."},{"k":"n","n":2,"x":"**İbnü's-Salâh:** Tirmizî'nin hasen'den maksadı ıstılahi değil lügavi manadır."},{"k":"n","n":3,"x":"**İbn Dakîkü'l-Îd:** Hasen hadisin illa da sahih hadisten alt mertebede olması gerekmez. Hasen bir hadisin sahihten aşağıda olması için tek bir isnadla gelmesi gerekmektedir. Bundan dolayı Tirmizî'nin bu sözündeki hasen ile sahih aynı şeydir."},{"k":"n","n":4,"x":"**İbn Kesîr:** Hasen hükmü sahih hükmüne içirildiği gibi sahih hükmü de hasen hükmüne içirilmektedir."},{"k":"h","x":"İbn Hacer'in görüşü (muteber görüş)"},{"k":"li","x":"Bu durumda iki ihtimal vardır: Bu hadis ya tek tarikle gelmiştir ya da iki veya daha fazla tarikten gelmiştir."},{"k":"li","x":"**Tek tarikle gelmişse:** «حسن (أو) صحيح» demektir."},{"k":"li","x":"**İki ve daha fazla ise:** «حسن (و) صحيح» demektir."}]},{"h":"Beğavî'nin \"hasen\" ıstılahı","b":[{"k":"li","x":"Ebu Muhammed el-Hüseyn b. Mes'ud."},{"k":"li","x":"Kütüb-i Sitte'nin bir müstahreci gibidir."},{"k":"li","x":"Eserin ismi **Mesâbîhu's-Sünne**'dir."},{"k":"li","x":"Hadisler sıhâh ve hisân (sahih-hasen) diye iki kısımdır."},{"k":"li","x":"Sahih: Buhari ve Müslim'dir. Hasen ise Ebu Davud, Tirmizî ve Nesâî'nin sünenleridir."},{"k":"li","x":"Bu taksiminden dolayı tenkide uğramıştır."}]},{"h":"Sahih ve hasen hadis ile ilgili bazı terimler","b":[{"k":"d","t":"Ceyyid «جيد»","x":"Bazı muhaddisler hasenden üstün ve sahihe yakın anlamında kullanmışlardır."},{"k":"d","t":"Kavî «قوي»","x":"Sahih anlamında kullanılmaktadır."},{"k":"d","t":"Sâlih «صالح»","x":"Sahihi de haseni de kapsayabilir. (Ebu Davud bir hadis hakkında değerlendirme yapmamışsa sâlih kavramını kullanmaktadır.)"},{"k":"d","t":"Sâbit / Mücevved «ثابت / مُجَوَّد»","x":"Sahih ve haseni de kapsar."},{"k":"d","t":"Müşebbeh «مُشَبَّه»","x":"Hasen ve zayıfı kapsar."},{"k":"d","t":"Ma'rûf «معروف»","x":"Münkerin zıddıdır."},{"k":"d","t":"Mahfûz «محفوظ»","x":"Şazzın zıddıdır."}]}]},{"t":"Zayıf Hadis","intro":"Zayıf hadisin tanımı ve çeşitleri, zayıf hadisle amel konusundaki üç görüş, zayıf hadisle ilgili meseleler ve zayıf hadislerin bulunduğu kaynaklar.","s":[{"h":"Tanım","b":[{"k":"d","t":"Zayıf Hadis","x":"Kabul sıfatlarını tamamlamamış hadis türüdür. «هو الحديث الذي لم يستكمل صفات القبول»"}]},{"h":"Zayıf hadisin çeşitleri","b":[{"k":"li","x":"İbnü's-Salâh zayıf hadisin 42 nevi olduğunu belirtmiştir. İbn Hibban 49 neviye çıkarmıştır."},{"k":"li","x":"Zayıf hadisin çeşitleri olarak mürsel, münkatı, muallak, mu'dal, müdelles, mürsel-i hafî, şaz, münker, muzdarib, metruk, muallel, maklûb gibi hadisleri sayabiliriz."}]},{"h":"Derece farkları ve en zayıf senet","b":[{"k":"li","x":"Bir hadisin zayıflık derecesi ne kadar az olursa o kadar hasen li-ğayrihî olması kolaylaşır."},{"k":"li","x":"Bu bağlamda en önemli husus ravinin adalet vasfı ve kesretü'l-hatadır. Eğer kişi adalet vasfını kaybetmiş veya çok hata yapıyorsa bu ravinin rivayeti asla hasen olamaz."},{"k":"not","x":"Silsiletü'z-Zeheb ne kadar kuvvetli ise aşağıdaki senet ise bir o kadar zayıftır: **es-Süddî es-Sağîr Muhammed b. Mervân – el-Kelbî Muhammed b. Sâib – Ebu Salih Bâzâm Mevlâ Ümmi Hânî – Abdullah b. Abbas**"}]},{"h":"Zayıf hadisle amel","b":[{"k":"n","n":1,"x":"**1. Mezhep:** Yahya b. Maîn ve Ebubekir b. el-Arabî. Hiçbir şekilde amel edilmez."},{"k":"n","n":2,"x":"**2. Mezhep:** Ahmed b. Hanbel, Ebu Davud es-Sicistânî, Ebu Hanife ve İmam Malik. Akaid dışında amel edilebilir."},{"k":"n","n":3,"x":"**3. Mezhep:** Cumhur ulema ve muhaddisler bu görüştedir. Akaid ve helal-haram gibi ameller dışında amel edilebilir. Şartları:"},{"k":"li","x":"Za'fı şedid olmayacak."},{"k":"li","x":"Meşru genel bir hükme bağlı olacak."},{"k":"li","x":"Kesin bir rivayet gibi düşünülmeyecek."}]},{"h":"Zayıf hadisle ilgili meseleler","b":[{"k":"n","n":1,"x":"İsnadı zayıf bir hadis varsa \"hadis, bu isnadı ile zayıftır\" denilmesi gerekir. Direkt \"bu hadis zayıftır\" denilmemesi gerekir."},{"k":"n","n":2,"x":"İsnadsız zayıf hadis rivayetinde «رُوِيَ كذا / بلغنا كذا / ورد كذا» gibi temriz sığaları kullanılması gerekir."},{"k":"n","n":3,"x":"Merdud hadiste bir işkal varsa, ulemanın çoğu bu hadisin işkaline cevap vermek ile uğraşmama görüşündedir."},{"k":"n","n":4,"x":"Hafız bir zat bir hadise \"bunu bilmiyorum\" derse bu söz ile yetinilir ve bu hadisin merdud olması için yeterli bir sebeptir."}]},{"h":"Zayıf hadisin kaynakları","b":[{"k":"li","x":"Müstakil ve mutlak olarak \"zayıf hadisler\" diye bir çalışma yapılmamıştır."},{"k":"n","n":1,"x":"**Nevâdirü'l-Usûl fî Ehâdîsi'r-Rasûl** → Hakîm et-Tirmizî (mutasavvıf olan)"},{"k":"n","n":2,"x":"**Firdevsü'l-Ahbâr bi-Me'sûri'l-Hitâb** → Deylemî"},{"k":"n","n":3,"x":"**eş-Şihâb fi'l-Mevâiz ve'l-Âdâb** → Kudâî"},{"k":"n","n":4,"x":"Târîhu Bağdâd"},{"k":"n","n":5,"x":"Târîhu Dımeşk"},{"k":"n","n":6,"x":"Târîhu Nîsâbûr"},{"k":"n","n":7,"x":"İbn Ebi'd-Dünyâ'nın tüm eserleri"},{"k":"n","n":8,"x":"Hilyetü'l-Evliyâ ve Delâilü'n-Nübüvve"}]}]},{"t":"Sahih-Hasen-Zayıf Hadis ile Alakalı Ortak Kavramlar","intro":"Muttasıl, merfu, müsned, mevkuf ve maktu hadisler; kudsî hadis; mevkuf ve maktunun hücceti ve hükmen merfu hadisin bilinme yolları.","s":[{"h":"Muttasıl Hadis","b":[{"k":"d","t":"Muttasıl Hadis","x":"Senedin başından müntehasına kadar muttasıl olan hadistir."},{"k":"li","x":"Sahih ve hasen örneklerinin tümü muttasıldır. Çünkü bu hadislerin bir şartı senedin muttasıl olmasıdır."},{"k":"li","x":"Bazı alimler senedin müntehası tabiinden olursa «هذا متصل إلى سعيد بن المسيب» gibi özellikle belirtirler. Fakat cumhur ulema mutlak \"muttasıl\" kavramını yeterli görür."},{"k":"li","x":"Muttasıl hadis sahih, hasen ve zayıf olabilir."}]},{"h":"Merfu Hadis","b":[{"k":"d","t":"Merfu Hadis","x":"Peygamber Efendimiz'e (sav) söz, fiil, takrir, ahlaki ve fiziki sıfatlardan izafe edilen her şeyi kapsar."},{"k":"li","x":"Merfu hadis bazen muttasıl, bazen munkatı, bazen mürsel olabilir."},{"k":"li","x":"Sahih, hasen ve zayıf olma ihtimali vardır."}]},{"h":"Müsned Hadis","b":[{"k":"d","t":"Müsned Hadis","x":"Hem merfu hem de muttasıl olan hadistir."},{"k":"li","x":"Sahih, hasen ve zayıf olma ihtimali vardır."},{"k":"li","x":"Her müsned muttasıldır fakat her muttasıl müsned değildir."},{"k":"li","x":"Her müsned merfudur fakat her merfu müsned değildir."}]},{"h":"Mevkuf Hadis","b":[{"k":"d","t":"Mevkuf Hadis","x":"Senedi muttasıl olsun veya olmasın müntehası sahabe olan hadistir. Sahabe efendilerimizin söz, fiil ve takrirlerini kapsar."},{"k":"h","x":"Kaynakları"},{"k":"n","n":1,"x":"İbn Ebî Şeybe → Musannef"},{"k":"n","n":2,"x":"Abdürrezzâk b. Hemmâm es-San'ânî → Musannef"},{"k":"n","n":3,"x":"İmam Malik → Muvatta"},{"k":"n","n":4,"x":"Taberî → Câmiu'l-Beyân tefsiri"},{"k":"n","n":5,"x":"İbn Ebî Hâtim'in tefsiri"},{"k":"n","n":6,"x":"İbnü'l-Münzir en-Nîsâbûrî'nin tefsiri"},{"k":"n","n":7,"x":"Ebu Nuaym el-İsfahânî → Hilyetü'l-Evliyâ ve Tabakâtü'l-Asfiyâ"},{"k":"n","n":8,"x":"İbn Ebi'd-Dünyâ"}]},{"h":"Maktu Hadis","b":[{"k":"d","t":"Maktu Hadis","x":"Senedi muttasıl olsun veya olmasın müntehası tabiin olan hadistir."},{"k":"li","x":"Maktu hadisin kaynakları, mevkuf hadisin kaynakları ile aynıdır."}]},{"h":"1. Mesele: Kudsî hadis","b":[{"k":"li","x":"Kudsî hadis merfu hadisin altında bir kategoridir. Zira ikisinin de lafızları Efendimiz'e (sav), manası Allah Teâlâ'ya aittir."},{"k":"h","x":"Kur'an-ı Kerim ile kudsî hadis arasındaki fark"},{"k":"li","x":"Kur'an hem mana hem de lafız itibariyle Allah'a aittir."},{"k":"li","x":"Kur'an meydan okuyarak benzerini getirmekten aciz bırakır."},{"k":"li","x":"Kur'an'ın sübutu katidir."},{"k":"not","x":"İmam el-Münâvî ve Muhammed el-Medenî et-Trabzonî'nin «الإتحافات السنية في الأحاديث القدسية» adlı eseri kaynakları arasında sayılabilir."}]},{"h":"2. Mesele","b":[{"k":"li","x":"Eğer müntehası tabiin olan bir hadise mevkuf denilirse kayıt getirilerek şöyle denilir: «هو موقوف على كذا»"}]},{"h":"3. Mesele: Mevkuf ve maktunun hücceti","b":[{"k":"li","x":"Sahabe icma ettiyse hüccettir. İhtilaf ettiyse Şâfiî dışında cumhura göre yine hüccettir."},{"k":"li","x":"Maktu hadis ise genel görüşe göre hüccet değildir."}]},{"h":"Hükmen merfu (4.–8. meseleler)","b":[{"k":"n","n":1,"x":"Eğer sahabe **\"Peygamber zamanında\"** diye bir kayıt koyarsa bu hükmen merfudur. Mutlak olarak \"biz şöyle yapardık\" diye rivayet ederse hükmen merfu olmaz (İbnü's-Salâh, Hatîb el-Bağdâdî)."},{"k":"n","n":2,"x":"Eğer sahabe **\"emrolunduk, nehyolunduk\"** gibi lafızlarla rivayet ederse kesinlikle hükmen merfudur."},{"k":"n","n":3,"x":"Eğer sahabe **\"bu sünnettendir\"** gibi bir ifade kullanıyorsa bu da kesinlikle hükmen merfudur."},{"k":"n","n":4,"x":"Sahabe **kendi görüşünden veya içtihadından hareketle söylemesi mümkün olmayan** bir söz söylerse bu da hükmen merfudur. Çünkü bu gibi konuları Efendimiz'in dışında bir kimseden duyamaz. Fakat bir sahabenin ehl-i kitaptan rivayet etmesi meşhursa gayb konusunda hükmen merfu diyemeyiz."},{"k":"n","n":5,"x":"**Esbâb-ı nüzûl** da hükmen merfudur."},{"k":"n","n":6,"x":"Ravi senedi zikrederken sahabiyi söyledikten sonra «يرفعه / ينميه / يبلغ به» gibi lafızlar kullanırsa bu da hükmen merfudur."}]}]},{"t":"Senedden Ravi Düşmesi: Mürsel, Munkatı, Mu'dal, Muallak","intro":"Zayıf hadisin nevilerinden senetteki kopukluğa göre adlandırılanlar: mürsel ve hücciyeti, sahabe mürseli, munkatı, mu'dal ve muallak hadis.","s":[{"h":"Mürsel Hadis","b":[{"k":"d","t":"Mürsel Hadis","x":"Vasıtayı zikretmeksizin tabiinin Efendimiz'e (sav) isnad etmiş olduğu hadistir."},{"k":"li","x":"**Tâbiî-i kebîr:** Said b. Müseyyeb, Kays b. Ebî Hâzim"},{"k":"li","x":"**Tâbiî-i sağîr:** İbn Şihâb ez-Zührî, Yahya b. Said el-Ensârî"}]},{"h":"Mürselin hücciyeti","b":[{"k":"n","n":1,"x":"**Mürsel hadis mutlak olarak zayıftır:** Cumhur muhaddislerin görüşüdür."},{"k":"n","n":2,"x":"**Mutlak olarak hüccettir:** Cumhur fukaha ve müçtehitlerin görüşüdür. \"Mürsel, müsnetten daha kuvvetlidir\" demişlerdir."},{"k":"n","n":3,"x":"**Kibâr-ı tâbiînden gelen rivayetler hüccettir:** İmam Şâfiî'nin görüşüdür."},{"k":"h","x":"İmam Şâfiî'nin mürsel şartları"},{"k":"n","n":1,"x":"Hadis, başka bir vecihle müsned olarak gelecek."},{"k":"n","n":2,"x":"Hadis, başka bir vecihle mürsel olarak gelecek. Fakat iki mürselin mürsillerinin hocası farklı olacak."},{"k":"n","n":3,"x":"Sahabe kavliyle desteklenecek."},{"k":"n","n":4,"x":"İlim ehlinin çoğu bu mürsel ile fetva vermiş olacak."},{"k":"n","n":5,"x":"Zikredilmeyen ravi başka isnadlarda mechul veya mecruh olan bir ravi olmayacak."}]},{"h":"Mürsel hadis rivayet eden en meşhur tabiiler","b":[{"k":"li","x":"**Medine:** Said b. Müseyyeb"},{"k":"li","x":"**Mekke:** Atâ b. Ebî Rebâh"},{"k":"li","x":"**Mısır:** Said b. Ebî Hilâl"},{"k":"li","x":"**Şam:** Mekhûl ed-Dımeşkî"},{"k":"li","x":"**Basra:** Hasan-ı Basrî"},{"k":"li","x":"**Kûfe:** İbrahim b. Yezid en-Nehaî"}]},{"h":"Mürselin kaynakları","b":[{"k":"n","n":1,"x":"**el-Merâsîl** → Ebu Davud es-Sicistânî (ale'l-ebvâb)"},{"k":"n","n":2,"x":"**el-Merâsîl** → İbn Ebî Hâtim (ale'r-ricâl)"},{"k":"n","n":3,"x":"**Beyânü'l-Mürsel** → Birdîcî"},{"k":"n","n":4,"x":"**Câmiu't-Tahsîl bi-Ahkâmi'l-Merâsîl** → el-Alâî"}]},{"h":"Sahabe Mürseli","b":[{"k":"d","t":"Sahabe Mürseli","x":"Sahabenin yaş küçüklüğü, geç Müslüman olması, hazır bulunmaması veya işitmediği bilinen bir hadisi Efendimiz'e isnat ettiği hadistir."},{"k":"li","x":"Cumhur ulemaya göre hüccettir. Çünkü bir sahabe genellikle bir sahabeden nakil yapar. Tüm sahabeler de udûl olduğuna göre bir problem teşkil etmez. Ayrıca bir tabiinden rivayet etseydi kesinlikle bunu belirtirdi."}]},{"h":"Munkatı Hadis","b":[{"k":"d","t":"Munkatı Hadis","x":"Sahabeden önce ravinin düştüğü her yerde sadece bir ravinin düştüğü hadistir."},{"k":"li","x":"İmam Şâfiî bunu maktu diye isimlendirmiştir."},{"k":"li","x":"Bazıları ise bizim maktu dediğimize munkatı demişlerdir."},{"k":"li","x":"**Hükmü:** Senedden düşen kişinin durumu bilinmediği için zayıftır ve hüccet değeri yoktur."}]},{"h":"Mu'dal Hadis","b":[{"k":"d","t":"Mu'dal Hadis","x":"Senedinde peşpeşe iki veya daha fazla ravi düşen hadistir."},{"k":"li","x":"Munkatı'dan daha düşük derecededir. Dolayısıyla hüccet değeri yoktur."},{"k":"li","x":"İbn Ebi'd-Dünyâ'nın eserlerinde ve Mansur b. Şu'be'nin \"Sünen\" isimli eserinde munkatı ve mu'dal hadis bulmak mümkündür."}]},{"h":"Muallak Hadis","b":[{"k":"d","t":"Muallak Hadis","x":"Senedin baş tarafından bir veya daha fazla ravinin peşpeşe düştüğü hadistir."},{"k":"li","x":"Ravinin durumu veya düşen raviler bilinmediği için zayıftır, munkatı hükmündedir."},{"k":"h","x":"Sahihayn ve Muvatta muallakları"},{"k":"n","n":1,"x":"İbn Hacer, Buhari'nin muallak hadislerini araştırmıştır. **\"Tağlîku't-Ta'lîk\"** adlı eserinde başka tariklerle veya Buhari tarikiyle bunların ittisalini tespit etmiştir."},{"k":"n","n":2,"x":"Sahih-i Müslim'de sadece **14** muallak hadis vardır. **İmam Nevevî** bunları, üzerine yazmış olduğu şerhinde açıklamış ve ittisalini ispat etmiştir."},{"k":"n","n":3,"x":"İmam Malik'in Muvatta'sındaki «بلغني» lafızları da muallak kabilindendir. Bunları ise **İbn Abdilberr** \"et-Temhîd limâ fi'l-Muvatta' mine'l-Meânî ve'l-Esânîd\" adlı eserinde dört hadis hariç hepsinin ittisalini ispat etmiştir."},{"k":"h","x":"Mu'dal ve muallakın farkları"},{"k":"n","n":1,"x":"Mu'daldaki ravi düşüklüğü senedin ortasında da olabilir."},{"k":"n","n":2,"x":"Muallak senedin başından bir ravinin düşmesiyle de olabilir."},{"k":"n","n":3,"x":"Eğer senedin başından iki veya daha fazla düşerse hem mu'dal hem muallaktır."}]}]},{"t":"Tedlis ve Mürsel-i Hafî","intro":"Müdelles hadis, tedlisü'l-isnad ve tedlisü'ş-şuyûh ile çeşitleri ve hükümleri; mürsel-i hafî, bilinme yolları ve tedlisle farkı.","s":[{"h":"Müdelles Hadis","b":[{"k":"d","t":"Müdelles Hadis","x":"İsminde bir inkıta veya kapalılık şüphesi bulunan, tedlis ile maruf bir ravinin rivayet ettiği hadistir."}]},{"h":"Tedlîsü'l-İsnâd","b":[{"k":"d","t":"Tedlîsü'l-İsnâd","x":"Ravinin, likâ ve semâ' ettiği raviden işitmediği hadisi de işitmiş gibi vehmettirecek lafızlarla rivayet etmesidir."},{"k":"h","x":"Çeşitleri"},{"k":"d","t":"Tedlîsü'l-Kat'","x":"Edâ lafzını zikretmeksizin kendisinden işittiği hocasından işitmediği hadisi aktarmasıdır."},{"k":"d","t":"Tedlîsü't-Tesviye","x":"Birbirileriyle karşılaşmış olan iki sika ravi arasında var olan zayıf bir ravinin düşürülerek iki sika arasında rivayet edilmiş izlenimi vermektir."},{"k":"d","t":"Tedlîsü'l-Atf","x":"Ravinin iki hocası var. Hadisi bir hocasından kesin işittiğini gösterecek lafızla aktardıktan sonra işitmediği hocasını da atıf yoluyla isnada katmasıdır. «حدثنا حصين ومغيرة عن إبراهيم»"},{"k":"h","x":"Tedlîsü'l-isnad ve çeşitlerinin hükmü"},{"k":"n","n":1,"x":"Eğer rivayet edilen hadis makbul olmayıp bunun gizlenmesi niyetiyle yapılırsa **haramdır**."},{"k":"n","n":2,"x":"Eğer tedlis yapan kişi kendisinden yaşça küçük olan bir raviden rivayet etmeyi gizliyorsa bu **mekruhtur**."},{"k":"n","n":3,"x":"Eğer talebelerini imtihan için yapıyorsa bu **caizdir** (doğrusunu söyleme kaydıyla)."},{"k":"not","x":"Kişi bir kere tedlis yapsa bile diğer rivayetlerinde «سمعت / حدثني» gibi lafızlar yoksa ihtiyatlı davranılır."}]},{"h":"Tedlîsü'ş-Şuyûh","b":[{"k":"d","t":"Tedlîsü'ş-Şuyûh","x":"Durumunu gizlemek adına tanındığı ismin hilafına ravinin hocasını isimlendirmesi, yeni bir künye oluşturması ve ona lakap takmasıdır."},{"k":"d","t":"Tedlîsü'l-Bilâd","x":"Bir belde ismi verip o beldeyi değil de başka yerde bir sokağı veya köyü kastetmek. (Endülüs deyip Karafe'de bir sokağı kastetmek gibi.)"},{"k":"h","x":"Hükmü"},{"k":"li","x":"Her ne kadar tedlis-i isnaddan kerahet bakımından hafif kalsa da ulema bu tedlisi de kerih görmüşlerdir."},{"k":"h","x":"Sebepleri"},{"k":"n","n":1,"x":"Kişinin zayıflığından dolayı tedlis ki bu kısma haram diyenler de vardır."},{"k":"n","n":2,"x":"Hocası çok yaşamış, kendisi de ondan yaşça çok küçük birisi de talebesi olmuş. Bundan dolayı farklı isim kullanması hafif de olsa mekruhtur."},{"k":"n","n":3,"x":"Tek hocadan işittiği halde çok hocadan işitmeyi vehmettirme."},{"k":"n","n":4,"x":"Talebeyi sınamak."}]},{"h":"Müdelles hadis eserleri","b":[{"k":"n","n":1,"x":"**Manzûme** → Şemseddin ez-Zehebî"},{"k":"n","n":2,"x":"**et-Tebyîn li-Esmâi'l-Müdellisîn** → Burhaneddin Ebu'l-Vefâ"},{"k":"n","n":3,"x":"**Ta'rîfü Ehli't-Takdîs bi-Merâtibi'l-Mevsûfîn bi't-Tedlîs** → İbn Hacer el-Askalânî"}]},{"h":"Mürsel-i Hafî","b":[{"k":"d","t":"Mürsel-i Hafî","x":"Ravinin, muasır olup likâ olmayan veya likâ olsa bile semâ' olmayan kişiden rivayet etmesidir. (Yani kesinlikle bu kişiden bir şey işitmemiş.)"},{"k":"li","x":"**Munkatıdan farkı:** Munkatı hadiste ittisal yoktur. Ravi ile rivayet edilen kişi muasır değildir."},{"k":"h","x":"Bilmenin yolları"},{"k":"n","n":1,"x":"**Likâ yok:** Aynı asırda yaşamasına rağmen tarihi kaynak veya buna muttali olan bir imamdan, likâ olmadığına dair bir delil ile bilinmesidir."},{"k":"n","n":2,"x":"**Semâ' yok:** Likâ olsa dahi kişinin bizzat bildirmesi veya bu ilmi bilen birisinin söylemesi yoluyla semâ'ın olmadığının bilinmesidir."},{"k":"n","n":3,"x":"**Başka rivayet:** Ravi hadisi «عن رجل» ile aktardıktan sonra başka rivayette «نُبِّئْتُ عنه» veya «أُخْبِرْتُ عنه» gibi lafızlar kullanırsa bilinir."},{"k":"h","x":"Tedlîsü'l-isnad ve mürsel-i hafînin farkı"},{"k":"n","n":1,"x":"Müdelleste rivayet ettiği kişiden başka hadis işitmiştir. Mürsel-i hafîde ise hiçbir şey işitmemiştir."},{"k":"n","n":2,"x":"Dolayısıyla müdelleste belki işitmiş olabilir vehmi vardır. Mürsel-i hafîde o ihtimal yoktur (mürsel-i hafî olduğunu bilirsek)."},{"k":"h","x":"Mürsel-i hafînin hükmü"},{"k":"li","x":"Zayıf hadis hükmündedir."},{"k":"li","x":"Bu, metninin de zayıf olduğu anlamına gelmez. Başka sahih bir tarik varsa metin sahih olur."}]}]},{"t":"Şâz, Münker, Muzdarib ve Muallel Hadis","intro":"Ravilerin muhalefeti ve teferrüdüne göre şâz ve münker; rivayetteki ihtilafa göre muzdarib; gizli kusura göre muallel hadis.","s":[{"h":"Şâz Hadis","b":[{"k":"d","t":"Şâz Hadis","x":"Sika veya makbul olan bir ravinin, kendisinden hıfz ve itkan konusunda daha üstün bir veya birçok raviye muhalif hadis rivayet etmesidir."},{"k":"li","x":"Şâz hadis zayıftır ve merduttur. Burada mahfuz hadis hüccettir."},{"k":"li","x":"Şazzın zıddı mahfuz hadistir."},{"k":"h","x":"Şartları"},{"k":"n","n":1,"x":"Ravinin sika olması veya makbul olduğu halde rivayetinde teferrüd etmesi."},{"k":"n","n":2,"x":"Kabul edilme noktasında kendisinden daha evlâ olana muhalefet etmesi. (Eğer teâruz giderilirse şâz olmaktan çıkar.)"},{"k":"h","x":"Şâz iki kısımdır"},{"k":"d","t":"Senette Şâz","x":"Sika olan bir ravinin, sikalar arasında meşhur olmuş bir hadisin senedinde muhalefet etmesidir. (İki mürsel aynı, müsned ise teferrüd etse burada mürsel tercih edilir. Çünkü önemli olan iki ravinin birleşmesidir.)"},{"k":"d","t":"Metinde Şâz","x":"Sika ravinin, hadisin lafızlarında kendisinden daha râcih ve sika olan ravilere muhalefet etmesidir."},{"k":"h","x":"Şazzın tanımları"},{"k":"li","x":"**Hâkim:** Sikanın teferrüt ettiği hadistir. (Muhalefet şartı eksik.)"},{"k":"li","x":"**Halîlî:** Sika veya değil bir ravinin teferrüt ettiği hadistir. (Muhalefet şartı eksik.)"},{"k":"li","x":"**İbn Dakîkü'l-Îd:** Sikaların rivayetine muhalefet etmektir veya zayıf bir ravinin teferrüt ettiği hadistir. (Şâz ve münkeri aynı manada kullandı.)"},{"k":"h","x":"Râvi infirad ederse (İbnü's-Salâh)"},{"k":"n","n":1,"x":"**İnfirad ettiği hadis kendisinden daha sika bir ravi ise:** Şâz ve merduttur. Eğer muhalif ravi zayıfsa münkerdir."},{"k":"n","n":2,"x":"**İnfirad ettiği hadisi başkası rivayet etmeyip tek kalması:** Âdil, zabt ve sika ise rivayeti makbuldür, infirad ettiği hadisin değeri düşmez. Sika olmayıp zabtı zayıf ise sahihlik mertebesinden düşer."}]},{"h":"Münker Hadis","b":[{"k":"d","t":"Münker Hadis","x":"Zayıf ravinin sika olan bir raviye muhalefet ettiği hadistir."},{"k":"li","x":"Münker hadis za'fı şedîddir. Dolayısıyla herhangi bir itibar çalışması ile hasen derecesine çıkamaz."},{"k":"li","x":"Münkerin zıddı ma'ruf hadistir."},{"k":"li","x":"Ahmed b. Hanbel ve Nesâî'ye göre münker hadis teferrüt edilen hadistir. (Zayıf olma ve muhalefet şartı yok.)"},{"k":"li","x":"İmam Müslim'e göre ise zayıf ravinin teferrüt etmesidir. (Muhalefet şartı yok.)"},{"k":"h","x":"Cerh lafızları"},{"k":"d","t":"«روى المناكير» (Revâ'l-menâkîr)","x":"Diğer rivayetleri terk edilmez."},{"k":"d","t":"«يروي أحاديث منكرة» (Yervî ehâdîse münkere)","x":"Diğer rivayetleri terk edilmez."},{"k":"d","t":"«منكر الحديث» (Münkerü'l-hadîs)","x":"Diğer rivayetleri de terk edilir."},{"k":"not","x":"Hem şazda hem de münkerde muhalefet vardır. Şazda sika veya makbul, münkerde zayıf muhaliftir."}]},{"h":"Muzdarib Hadis","b":[{"k":"d","t":"Muzdarib Hadis","x":"İki aynı seviye ravinin, aralarında tercih yapma imkânı olmaksızın farklı bir şekilde rivayet ettiği hadistir."},{"k":"h","x":"Şartları"},{"k":"n","n":1,"x":"İhtilaf vecihleri eşit, biri diğerine tercih edilemez olmalıdır."},{"k":"n","n":2,"x":"Tearuzun giderilememesi gerekir."},{"k":"not","x":"Bu konudaki tek eser **İbn Hacer**'in **\"el-Muktarib fî Beyâni'l-Muztarib\"** adlı eseridir."},{"k":"h","x":"Kısımları"},{"k":"li","x":"**Senette muzdarib:** «إذا عطس أحدكم فليقل: الحمد لله على كل حال، وليقل له: يرحمكم الله، وليقل هو: يهديكم الله ويصلح بالكم» rivayetinde Muhammed b. Abdurrahman b. Ebî Leylâ'nın sahabe tabakasında hem Hz. Ali'den hem de Hz. Ebu Eyyûb el-Ensârî'den rivayet etmesi senetteki ıztıraptır."},{"k":"li","x":"**Metinde muzdarib:** Hz. Enes'ten rivayet edilen meşhur besmele hadisi."},{"k":"h","x":"Muzdarib hadisin hükmü"},{"k":"li","x":"İster metinde ister senette olsun ravi veya ravilerin zabtının olmadığını vehmettirmesinden dolayı hadis zayıftır. Mamûlün bih değildir."},{"k":"li","x":"Eğer ki tek bir ravinin isminde, babasının isminde, nisbesinde olursa ıztırap kaydıyla beraber mamûlün bih olur. (Ma'kıl b. Sinan hadisi)"}]},{"h":"Muallel Hadis","b":[{"k":"d","t":"Muallel Hadis","x":"Zahiren hadisin sıhhat şartlarını taşıdığı gözüken fakat sıhhatini zedeleyen gizli bir kusur barındıran hadistir."},{"k":"li","x":"Senette muallel, metinde muallel ve her ikisinde de muallel olabilir."},{"k":"h","x":"Şartları"},{"k":"n","n":1,"x":"Kusurun gizli olması"},{"k":"n","n":2,"x":"Kusurun zedeleyici olması"},{"k":"h","x":"İlletin kısımları"},{"k":"n","n":1,"x":"**Hadisin zayıflığına sebep olacak zedeleyici illet:** Bu kusur açık olursa munkatı gibi olur. Gizli olursa işte bu muallel hadistir."},{"k":"n","n":2,"x":"**Zedeleyici olmayan kusur:** Bu da hadisin sıhhat derecesine zarar vermez."},{"k":"h","x":"Tanıma yolları"},{"k":"n","n":1,"x":"Tüm senetler toplanmalı"},{"k":"n","n":2,"x":"Ravilerin zabt ve hıfz yönünden durumu"},{"k":"n","n":3,"x":"Bulundukları tabakanın durumu"},{"k":"n","n":4,"x":"Başka karineler toplanmalı"},{"k":"n","n":5,"x":"Acele etmeden zann-ı galip ile hüküm vermek"},{"k":"not","x":"**İbn Kesîr:** Cahillere göre bizim bildiklerimiz kehanet hükmündedir."},{"k":"h","x":"Muallel hadisin hükmü"},{"k":"li","x":"Zayıf ve merdut olan bir hadistir."},{"k":"h","x":"Eserler"},{"k":"n","n":1,"x":"**el-İlel** → Ali b. Medînî"},{"k":"n","n":2,"x":"**İlelü'l-Hadîs** → Abdurrahman b. Ebî Hâtim"},{"k":"n","n":3,"x":"**el-İlelü'l-Vâride fi'l-Ehâdîsi'n-Nebeviyye** → Dârekutnî"}]}]},{"t":"Mevzu Hadis","intro":"Uydurma hadisin tanımı, uyduranlar ve uydurma sebepleri, hükmü, uydurma hadisi bilme yolları ve âlimlerin uydurmaya karşı mücadelesi.","s":[{"h":"Tanım","b":[{"k":"d","t":"Mevzu Hadis","x":"Efendimiz'e iliştirilmiş, yalan ve iftira olarak uydurulmuş sözdür."},{"k":"h","x":"Buna hadis denmesinin sebebi"},{"k":"n","n":1,"x":"Zann-ı galip ile hüküm verdiğimiz içindir."},{"k":"n","n":2,"x":"Uyduranın iddiası doğrultusunda denilir."},{"k":"h","x":"Üç kısımdan oluşur"},{"k":"n","n":1,"x":"Kişinin ya kendi sözüdür."},{"k":"n","n":2,"x":"Ya hikmetli söz veya atasözüdür."},{"k":"n","n":3,"x":"İsrâilî kıssalar olabilir."}]},{"h":"Hadis uyduranlar","b":[{"k":"n","n":1,"x":"Zındıklar"},{"k":"n","n":2,"x":"Mezhebini destekleyen"},{"k":"n","n":3,"x":"Meslek edinip kazanç sağlayan"},{"k":"n","n":4,"x":"Cahil dindarlar"},{"k":"n","n":5,"x":"Dünyevi amaç için ümeraya yalakalık yapanlar"},{"k":"n","n":6,"x":"Kötülük yapmak ya da galip gelmek için"},{"k":"n","n":7,"x":"Kasıtsız yapanlar"}]},{"h":"Hadis uydurmanın hükmü","b":[{"k":"li","x":"Yalan, aklın kendisini çirkin gördüğü, şeriatın cezalandırdığı büyük günahlardandır."},{"k":"li","x":"**İmam Cüveynî:** Bu kişi mürtettir."},{"k":"li","x":"**Cumhur:** Helal görmediği takdirde mürtet değil fasıktır."}]},{"h":"Uydurma hadisi rivayet etmenin hükmü","b":[{"k":"li","x":"Bu hadis ittifakla zayıf hadisin en şerlisidir."},{"k":"li","x":"Hangi konuda olursa olsun bir ravinin mevzu hadisi bile bile rivayet etmesi haramdır."},{"k":"li","x":"Tazir edilebilir."},{"k":"li","x":"Mevzu olduğunu bildirmek için bu rivayeti aktarıyorsa bunda bir sıkıntı yoktur."}]},{"h":"Hadis uydurma sebeplerinin en önemlileri","b":[{"k":"n","n":1,"x":"**İslam'a ilave:** Zındıklar, İslam'a karşı içlerinde sakladıkları kinden dolayı yaparlar. «لو أحسن أحدكم الظن بحجر لنفعه»"},{"k":"n","n":2,"x":"**Kendi görüşünü destekleme**"},{"k":"n","n":3,"x":"**Doğruya rücu etmekten kibirlenmek:** Bunu yapanlar hakkın başkasının elinden sadır olmasını kendilerine yedirememişlerdir. (Mekke'nin zorla veya barışla fethedilmesi)"},{"k":"n","n":4,"x":"**Kıssa yolu ile kazanç:** «عمر نور في الإسلام وسراج لأهل الجنة»"},{"k":"n","n":5,"x":"**Nüfuzlu ve sultanlara yanaşmak**"},{"k":"n","n":6,"x":"**Teşvik ve korkutma:** Bunu yapanlar hadisi insanların aleyhine değil lehine uydurduklarını iddia etmişlerdir."}]},{"h":"Uydurma hadisi bilme yolları","b":[{"k":"n","n":1,"x":"**Uyduranın ikrarı veya ikrar makamında:** Kişi kendisinin uydurduğunu söylemesi ile olur (Nuh b. Ebî Meryem gibi; fakat Babanzâde bu kişinin uydurmadığını söyler). İkrar makamında bir şeyle de anlaşılabilir: hocam dediği kişinin ravi doğmadan öldüğünü biliyorsak; bir beldede hocadan işittiğini söyleyip o hocanın o beldeye hiç gitmediğini biliyorsak."},{"k":"n","n":2,"x":"**Mana düşüklüğü «ركيك المعنى»:** Akılla, nakille ve usulle ters düşen hadislerdir."},{"k":"n","n":3,"x":"**Mübalağalı karşılıklar:** Küçük bir günaha büyük bir azap veya küçük bir amele büyük bir ödül gibi."},{"k":"n","n":4,"x":"**Hisse ve müşahedeye ters düşmesi**"},{"k":"n","n":5,"x":"**Sarih bir şekilde Kur'an'a, sünnete ve icmaya ters düşmesi:** Bu terslik tevile imkân vermeyen bir şey olması gerekir."},{"k":"n","n":6,"x":"**Ehil bir âlimin hiçbir kitapta bulamaması**"}]},{"h":"Âlimlerin ve muhaddislerin uydurmaya karşı mukavemetleri","b":[{"k":"n","n":1,"x":"**Rivayette tesebbüt:** Sadece adalet ve zabtı sağlam olan rivayet ehli kimselerden rivayet ediyorlardı. Hz. Osman zamanındaki fitnelerden dolayı bu ihtiyat erken dönemde başlamıştır."},{"k":"n","n":2,"x":"**Tüm hadisleri toplama ve tedvin etmeleri**"},{"k":"n","n":3,"x":"**Mevzu hadisleri derleyen kitaplar telif etmeleri**"}]},{"h":"Mevzu hadisleri derleyen eserler","b":[{"k":"n","n":1,"x":"**el-Mevzûât mine'l-Ehâdîsi'l-Merfûât (el-Ebâtîl)** → el-Cûzekânî"},{"k":"n","n":2,"x":"**el-Mevzûât** → İbnü'l-Cevzî"},{"k":"n","n":3,"x":"**el-Leâli'l-Masnûa fi'l-Ehâdîsi'l-Mevzûa** → Suyûtî (İbnü'l-Cevzî'nin eserinin muhtasarı)"},{"k":"n","n":4,"x":"**Zeylü'l-Leâlî** → Suyûtî (İbnü'l-Cevzî'nin almadığı mevzu hadisler)"},{"k":"n","n":5,"x":"**Tenzîhü'ş-Şerîati'l-Merfûa ani'l-Ehâdîsi'ş-Şenîati'l-Mevzûa** → İbn Irâk (Ale'l-ebvâb şeklindedir. 3 fasıldan oluşur: 1. fasıl Suyûtî ve İbnü'l-Cevzî'nin uydurma dediği, 2. fasıl İbnü'l-Cevzî, 3. fasıl ise Suyûtî'nin dediği şeklindedir.)"},{"k":"n","n":6,"x":"**el-Mevzûâtü'l-Kübrâ ve's-Suğrâ** → Ali el-Kârî"}]}]},{"t":"Müdrec ve Maklûb Hadis","intro":"Hadise sonradan karışan ziyadeler (müdrec) ile metin ve senette yer değiştirme (maklûb): kısımları, hükümleri ve eserleri.","s":[{"h":"Müdrec Hadis","b":[{"k":"d","t":"Müdrec Hadis","x":"Bizzat hadistenmiş gibi vehmettiren tarzda, kendisinde ziyadenin olduğu hadis türüdür."}]},{"h":"Metinde müdrec","b":[{"k":"li","x":"Rivayetin aslından olmayan, duyan kişinin hadisten zannettiği bazı ravilerin kelamlarından hadiste zikredilen kısımdır."},{"k":"li","x":"Başında, ortasında ve sonunda olmak üzere üç yerde vaki olur."},{"k":"li","x":"Çoğu idrac metinde meydana gelir. Senedde idrac azdır."},{"k":"li","x":"Amacı garip lafzı açıklamak ve murad olunan manayı açıklamaktır."},{"k":"not","x":"**Örnek:** «أن رسول الله ﷺ قال وهو على المنبر وذكر الصدقة والتعفف عن المسألة: اليد العليا خير من اليد السفلى، واليد العليا هي المنفقة والسفلى هي السائلة» Son kısım («واليد العليا هي المنفقة والسفلى هي السائلة») müdrectir; Abdullah b. Ömer'in (ra) sözüdür."}]},{"h":"İsnatta müdrec","b":[{"k":"n","n":1,"x":"Birçok isnatla rivayet edilen hadisi bir ravinin tek bir isnatta toplayıp rivayet etmesi ve bunu da beyan etmemesidir. Tek senet varmış vehmi uyandırır."},{"k":"n","n":2,"x":"Ravilerin eksik metnin isnadıyla tam metni rivayet etmeleridir. İki kısımdır: (a) Ravi eksik metinli bir isnada sahip; fakat aynı metin bir başka isnatla tam olarak gelmiş. Ravi eksik metnin isnadıyla tam metni rivayet ediyor. (b) Ravi hadisi hocasından vasıta olmaksızın eksik olarak alıyor; bir başka isnatta ise vasıtalı olarak tam metinle alıyor. Fakat vasıtayı hazfederek tam metni rivayet ediyor."},{"k":"n","n":3,"x":"Ravinin yanında iki ayrı sened ve metin vardır. Ravi bir senetle iki hadisi de rivayet ederse olur. Ya da ravi birisine özel isnatla metinleri rivayet eder fakat diğer metinden birincisinde olmayan şeyi ekleyerek bunu yaparsa olur."},{"k":"n","n":4,"x":"Muhaddis senedi zikrettikten sonra kendisine ârız olan bir şey sebebi ile kendinden bir söz söyler ve bu söz ise senedin metni zannedilir."}]},{"h":"Müdrecin hükmü","b":[{"k":"li","x":"**Hadisteki garip lafzı açıklama:** Bunlara müsamaha gösterilir. Fakat evlâ olan bunun hadisten olmadığını belirtmesidir."},{"k":"li","x":"**Kasıt olmaksızın ravinin hata ile yapması:** Bu hatasını tekrar etmezse problem teşkil etmez. Aksi takdirde zabtında kusur meydana gelir."},{"k":"li","x":"**Kasten îham ve iğrâb için yapması:** Ravinin adalet vasfı düşer ve yalanla itham edilir. Dolayısıyla kezzâb denilen kişilere ilhak olur."}]},{"h":"İdrac nasıl bilinir?","b":[{"k":"n","n":1,"x":"İdracın olmadığı başka bir metin gelirse"},{"k":"n","n":2,"x":"Ravi müdrec olduğunu belirtir veya işaret ederse"},{"k":"n","n":3,"x":"Hafız kimse müdrec olduğunu belirtirse"},{"k":"n","n":4,"x":"Efendimiz'e (sav) yaraşmayacak bir manada olması"}]},{"h":"Müdrec eserleri","b":[{"k":"n","n":1,"x":"**el-Fasl li'l-Vasli'l-Müdrec fi'n-Nakl** → Hatîb el-Bağdâdî"},{"k":"n","n":2,"x":"**Takrîbü'l-Menhec bi-Tertîbi'l-Müdrec** → İbn Hacer"},{"k":"n","n":3,"x":"**el-Medrec ilâ Ma'rifeti'l-Müdrec** → Suyûtî"},{"k":"n","n":4,"x":"**Teshîlü'l-Müdrec ile'l-Müdrec** → Abdülaziz el-Ğumârî"}]},{"h":"Maklûb Hadis","b":[{"k":"d","t":"Maklûb Hadis","x":"İbdâl, takdim ve tehir sebebi ile hadisin metin ve senedinde değişiklik meydana gelen hadistir."}]},{"h":"Metinde maklûb","b":[{"k":"li","x":"İki şeyden birine, diğerinin hak ettiği şeyi vermek veya buna benzer bir şeydir."},{"k":"li","x":"«إذا أمرتكم بشيء فأتوه وإذا نهيتكم عن شيء فاجتنبوه ما استطعتم» hadis-i şerifin bu varyantı maklûb olarak kabul edilir."},{"k":"li","x":"Bu hadisi Buhari ve Müslim şu şekilde rivayet etmiştir: «ما نهيتكم عنه فاجتنبوه وما أمرتكم به فأتوا منه ما استطعتم»"}]},{"h":"Senette maklûb","b":[{"k":"n","n":1,"x":"**Ravinin bir diğer ravi ile ibdâli:** Aynı tabakada olan bir ravinin diğeri ile değişimidir. (Hâkim → Yakub b. Ebî Seleme → Ebu Hureyre: Burada Hâkim aslında hadisi Yakub b. Seleme'den rivayet ediyor. Aynı tabakada olan Yakub b. Ebî Seleme'yi onun yerine zikrediyor.)"},{"k":"n","n":2,"x":"**Ravinin ismini kalb etme:** Muhammed b. İsmail ismini İsmail b. Muhammed diye zikretmek."},{"k":"n","n":3,"x":"**Senetlerin başka metinlerle kalbi:** Bir metnin senedinin alınıp başka bir metne konulması ve ilk metnin ise ikincinin senedi ile zikredilmesidir. Âlimlerin Buhari'ye yaptığı imtihan bu şekilde gerçekleşmiştir."}]},{"h":"Maklûb hadisin hükmü","b":[{"k":"n","n":1,"x":"**Eğer kalb hataen, sehven veya vehmen olursa** bu ravinin zapt eksikliğini gösterir ki hadis bundan dolayı zayıf olur."},{"k":"n","n":2,"x":"**Eğer kalb bilinçli bir şekilde amden olursa** bu ya iğrâb için olur ya da imtihan için olur."},{"k":"li","x":"**İğrâb:** Ravinin, diğer ravilerden bulunmayan kendisinin bildiği bir hadis olduğunu vehmettirmek için yapar ki bu kişinin adaletinin gitmesine sebep olur ve yalancılıkla itham edilir."},{"k":"li","x":"**İmtihan** için olursa da bu çok kez tekrarlanmayacak ve doğrusunun açıklanması durumunda caizdir."}]},{"h":"Eser","b":[{"k":"li","x":"**Râfiu'l-İrtiyâb fi'l-Maklûb mine'l-Esmâi ve'l-Elkâb** → Hatîb el-Bağdâdî"}]}]},{"t":"İtibar, Mütâbaat, Şâhid ve Sika Ravinin Ziyadesi","intro":"Bir hadisin başka tariklerinin araştırılması (itibar), mütâbaat ve şâhid; sika ravinin ziyadesi ve muttasıl senetteki ziyadelik.","s":[{"h":"İtibar","b":[{"k":"d","t":"İtibar","x":"Hadisin durumu hakkında; ravinin teferrüd edip etmediği ve hadisin bilinip bilinmediği konularını araştırmaktır."},{"k":"li","x":"İtibar, araştırmacının tüm hadis kaynaklarını tarayarak hadisin başka bir raviden de tariki olup olmaması konusunda hadisin tariklerini incelemektir."}]},{"h":"Mütâbaat","b":[{"k":"d","t":"Mütâbaat","x":"Bir hadisin rivayetinde, bir ravinin başka bir ravi ile şeyhinde veya daha üstü bir tabakada birleşmesidir."},{"k":"li","x":"Sahabelerin her halde aynı kişi olması gerekir."},{"k":"d","t":"Tam Mütâbaat","x":"Raviler şeyhlerinde birleşirse bu tam mütâbaat olur."},{"k":"d","t":"Nâkıs Mütâbaat","x":"Raviler şeyhlerinde değil de daha üstü bir tabakada birleşirse nâkıs mütâbaat olur."}]},{"h":"Şâhid","b":[{"k":"d","t":"Şâhid","x":"Bir sahabenin rivayet ettiği hadisin, başka bir sahabinin rivayetiyle mana veya lafız yönünden muvafık olmasıdır."},{"k":"not","x":"Müslim'in Sahih'i, mütâbaat ve şâhidleri bir hadiste ve tek bir yerde zikretmesiyle diğer kitaplardan ayrılmıştır."},{"k":"not","x":"**İbn Hacer:** Mütâbaat ve şâhid kavramları birbiri yerine kullanılabilir. Bu konuda genişlik vardır."}]},{"h":"Sika ravinin ziyadesi","b":[{"k":"n","n":1,"x":"Tek bir hadiste iki sika raviden birinin diğerinin yapmadığı bir ziyade ile meydana gelir."},{"k":"n","n":2,"x":"Ya da bir ravinin aynı hadisin iki rivayetinde birisinde yapmadığı bir ziyade ile meydana gelir."},{"k":"h","x":"Hükmü"},{"k":"n","n":1,"x":"**Mutlak olarak ziyade kabul edilir:** Cumhur muhaddis ve fukahanın görüşüdür."},{"k":"n","n":2,"x":"**Mutlak olarak kabul edilmez:** Bazı muhaddislerin görüşüdür."},{"k":"n","n":3,"x":"**Ziyade farklı ravilerden ise kabul, aynı raviden ise merdud olur.**"},{"k":"n","n":4,"x":"**İbnü's-Salâh'a göre:** Metinleri muhalifse ziyade şazdır. Metinler muhalif değilse ziyade makbuldür. Hadiste ravilerden başkasının zikretmediği ziyade lafız varsa iki şeye de ihtimallidir; red veya kabule hükmedilmez."}]},{"h":"Muttasıl senetteki ziyadelik","b":[{"k":"d","t":"el-Mezîd fî Muttasıli'l-Esânîd","x":"Ravinin senedi sahih ve muttasıl olan bir hadiste, hiçbir ravinin zikretmediği kişiyi bu senede eklemesidir."},{"k":"li","x":"Ziyadeli olarak aktarılan isnadın merdud olması için iki şart aranır:"},{"k":"n","n":1,"x":"Bu raviden daha zâbıt ve mütkin olması"},{"k":"n","n":2,"x":"«سمعت» lafzı ile aktarması"},{"k":"li","x":"**Temyîzü'l-Mezîd fî Muttasıli'l-Esânîd** → Hatîb el-Bağdâdî"}]}]},{"t":"Muanan, Müennen, Müselsel; Âlî ve Nâzil İsnat","intro":"İsnadın lafızları ve özelliklerine göre hadis çeşitleri: muanan ve müennen, müselsel hadis; âlî ve nâzil isnat ile âlî isnadın kısımları.","s":[{"h":"Muanan ve Müennen Hadis","b":[{"k":"d","t":"Muanan Hadis","x":"Tahdis, ihbar veya semâ yollarından biri söylenmeden sadece «عن» lafzı ile rivayet edilen hadistir."},{"k":"d","t":"Müennen Hadis","x":"Tahdis, ihbar veya semâ yollarından biri söylenmeden sadece «أنّ فلانا قال» şeklinde rivayet edilen hadistir."},{"k":"h","x":"Muanan hadisin hükmü"},{"k":"n","n":1,"x":"Bazıları muttasıl olduğu kesinleşmedikçe munkatı olduğunu söyler."},{"k":"n","n":2,"x":"Buhari, Ali b. Medînî gibiler ise ravi müdellis olmayıp ravi-şeyh arasında likâ var ise muttasıl sayarlar."},{"k":"n","n":3,"x":"İmam Müslim gibiler ise ravi müdellis olmayıp ravi-şeyh arasında imkânü'l-likâ var ise muttasıl sayarlar."},{"k":"not","x":"Müennen hadisin hükmü konusunda her ne kadar bazı muhaddisler muanan ittisal, müennen ise inkıtayı ifade eder deseler de cumhura göre müennen hadis de muanan hadisin hükümlerine tabidir."}]},{"h":"Müselsel Hadis","b":[{"k":"d","t":"Müselsel Hadis","x":"İsnattaki tüm ravilerin bizatihi tek tek, rivayet veya raviler ile alakalı veya bir durum hakkında tek bir vasıf üzere aktardıkları hadistir."},{"k":"li","x":"Teselsülün metinle bir alakası olmayıp sadece isnat ile alakalıdır."},{"k":"li","x":"Kavlî müselsel, fiilî müselsel ve hem kavlî hem fiilî müselsel olarak üç kısma ayrılır."},{"k":"li","x":"**Faydası:** Ravilerin hassasiyetini ve zapttaki kuvvetlerini gösterir."},{"k":"li","x":"**Hükmü:** Her müselsel hadis sahih değildir. Zayıf, hasen ve sahih olabilirler. En sahih müselsel hadisler ise hıfzının kuvvetli olduğu ravilerin rivayet ettiği hadislerdir."},{"k":"h","x":"Eserler"},{"k":"n","n":1,"x":"**el-Uzbü's-Selsel fi'l-Hadîsi'l-Müselsel** → Zehebî"},{"k":"n","n":2,"x":"**el-Cevâhirü'l-Mufassalât fi'l-Ehâdîsi'l-Müselselât** → İbn Taylesân"},{"k":"n","n":3,"x":"**Ciyâdü'l-Müselselât ve Müselselâtü'l-Kübrâ** → Suyûtî"},{"k":"n","n":4,"x":"**el-Menâhilü's-Selsele fi'l-Ehâdîsi'l-Müselsele** → Muhammed Abdülbâkî"},{"k":"n","n":5,"x":"**el-Fazlü'l-Mübîn fi'l-Müselsel min Hadîsi'n-Nebiyyi'l-Emîn** → Dihlevî"}]},{"h":"Âlî ve Nâzil İsnat","b":[{"k":"d","t":"Âlî İsnat","x":"Ravileri sayıları az olup bu bakımdan daha muteber kabul edilen isnattır."},{"k":"d","t":"Nâzil İsnat","x":"Âlî isnadın tam tersidir."},{"k":"not","x":"Âlî isnat sahihe en yakın, en rağbet edilen bir durumdur. Çünkü ravi ne kadar az ise hata ihtimali o kadar az olacaktır."}]},{"h":"Âlî isnadın kısımları","b":[{"k":"d","t":"Mutlak Uluv","x":"Peygamber Efendimiz'e en yakın olan sahih ve muttasıl hadistir. Sülâsiyat diye de isimlendirilir."},{"k":"li","x":"**Nisbî uluv** şu kısımlara ayrılır: hadis imamlarına yakınlığa göre, Kütüb-i Sitte'ye göre, ravinin vefatının önce olmasına göre, hadisi hocadan önce işitmeye göre."},{"k":"h","x":"Kütüb-i Sitte'ye göre uluv"},{"k":"d","t":"Muvâfakat","x":"Müstahrec yapan kişinin zikrettiği isnat asıldan daha az kişi olursa meydana gelir. (Fark: isnat muvafakatta hocada, bedelde ise hocanın hocasında birleşiyor.)"},{"k":"d","t":"Bedel","x":"İsnadın, asıl musannifin hocasının hocasında birleşmesiyle olan uluvdur."},{"k":"d","t":"Müsâvât","x":"Buhari'nin senedinde 8 kişi var. Sonradan gelen bir muhaddisin de (İmam Nevevî) kendine has senedinde 8 kişi var. Buna müsâvât denir. Örneği çok nadirdir."},{"k":"d","t":"Musâfaha","x":"Bu sayılan raviler İmam Nevevî'den değil de onun hocasından itibaren sayılır ve eşit olursa buna musâfaha denir."},{"k":"h","x":"Ravinin vefatının önce olmasına göre uluv"},{"k":"li","x":"Nevevî bir hadisi hem Beyhakî'den hem de İbn Halef'ten rivayet etmiş. Onlar da Hâkim'den 3 vasıta ile zikretmiş. Fakat Beyhakî'nin isnadı daha âlîdir. Çünkü Beyhakî İbn Halef'ten daha önce vefat etmiştir."}]}]},{"t":"Metne Dair İlimler: Garîb, Fıkıh, Nâsih-Mensûh, Muhtelif, Müşkil, Tashîf","intro":"Hadis metninin anlaşılmasına hizmet eden ilimler: garîbü'l-hadis, fıkhu'l-hadis, nâsihu'l-hadis ve mensûhu, muhtelefü'l-hadis, müşkilü'l-hadis ile musahhaf ve muharref.","s":[{"h":"Garîbü'l-Hadis","b":[{"k":"d","t":"Garîbü'l-Hadis","x":"Az kullanıldığından dolayı metinde bulunan, anlaşılmaktan uzak kapalı lafızların bulunduğu hadistir."},{"k":"li","x":"Bu kapalı lafızları açıklamayı hedefler."},{"k":"li","x":"Garibi ve hükümlerini bilmek en önemli meselelerdendir. Çünkü uygulama ve içerisinde barınan amele götüren bir yoldur."},{"k":"h","x":"Eserler"},{"k":"n","n":1,"x":"**el-Fâik fî Garîbi'l-Hadîs** → Zemahşerî"},{"k":"n","n":2,"x":"**en-Nihâye fî Garîbi'l-Hadîs ve'l-Eser** → İbnü'l-Esîr el-Cezerî"},{"k":"n","n":3,"x":"**ed-Dürrü'n-Nesîr Telhîsu Nihâyeti İbni'l-Esîr** → Suyûtî"}]},{"h":"Fıkhu'l-Hadis","b":[{"k":"d","t":"Fıkhu'l-Hadis","x":"Hadis metninin içerdiği, istinbat edilen ahkâm ve âdaplardır."},{"k":"li","x":"Hadisin daha iyi anlaşılmasına ve hükümlerin, meselelerin daha iyi istinbat edilmesine yardımcı olur."},{"k":"h","x":"Eserler"},{"k":"n","n":1,"x":"**Fethu'l-Bârî** → İbn Hacer"},{"k":"n","n":2,"x":"**el-Minhâc (Sahih-i Müslim'in şerhi)** → İmam Nevevî"},{"k":"n","n":3,"x":"**et-Temhîd limâ fi'l-Muvatta' mine'l-Meânî ve'l-Esânîd** → İbn Abdilberr"},{"k":"n","n":4,"x":"**İhkâmü'l-Ahkâm** → İbn Dakîkü'l-Îd"}]},{"h":"Nâsihu'l-Hadis ve Mensûhu","b":[{"k":"d","t":"Nâsih","x":"Önceki şer'î hükmün kalktığını gösteren hadis."},{"k":"d","t":"Mensûh","x":"Sonradan gelen şer'î delille hükmü kalkan hadis."},{"k":"d","t":"Nesh","x":"Şâri'in sonraki bir hüküm ile önce geleni hükmen kaldırmasıdır."},{"k":"h","x":"Neshi nasıl biliriz?"},{"k":"n","n":1,"x":"Efendimiz'in açıklaması (kabir ziyareti)"},{"k":"n","n":2,"x":"Sahabe efendilerimizin sözü"},{"k":"n","n":3,"x":"Tarih ile"},{"k":"n","n":4,"x":"İcma ile (icmanın delili nesh eder, bizatihi icma değil)"},{"k":"h","x":"Eserler"},{"k":"n","n":1,"x":"**Nâsihu'l-Hadîs ve Mensûhuh** → İbn Şâhin"},{"k":"n","n":2,"x":"**el-İ'tibâr fi'n-Nâsih ve'l-Mensûh mine'l-Âsâr** → Hâzimî"}]},{"h":"Muhtelefü'l-Hadis","b":[{"k":"d","t":"Muhtelefü'l-Hadis","x":"Zahiren birbirlerine aykırı manalar taşıyan iki makbul hadisteki tutarsızlığı gidermeye çalışan ilim dalıdır."},{"k":"li","x":"Zorlanmaksızın ikisini cem etmek mümkündür."},{"k":"li","x":"**Örnek:** «إذا بلغ الماء قلتين لم يحمل الخبث» ve «الماء طهور لا ينجسه شيء إلا ما غيّر طعمه أو لونه أو ريحه»"},{"k":"li","x":"Bu iki hadiste zahiren bir çelişki vardır. Birincisi daha umumi olarak gelmiştir. Diğeri ise daha özeldir. Biz bu iki hadisi cem ederek şöyle deriz: Eğer su iki kulleye ulaşır ve vasıflarından da birisi değişirse o su pis olur. Veya su iki kulleye ulaşmaz ve vasıflarından biri değişmese bile o su pistir."}]},{"h":"Müşkilü'l-Hadis","b":[{"k":"d","t":"Müşkilü'l-Hadis","x":"Zahiren bir nassa veya ilmî bir hakikata muhalif olması nedeniyle ya da Allah hakkında teşbih vehmettiren bir metne sahip olan hadisle ilgilenir."},{"k":"li","x":"**Örnek:** «من تقرّب إليّ شبرا تقرّبت منه ذراعا ومن تقرّب مني ذراعا تقرّبت منه باعا ومن أتاني يمشي أتيته هرولة»"},{"k":"li","x":"Zahiren bu hadiste teşbih ve tecsim vardır. Fakat manası şu şekildedir: Kim taat ile bana yürüyerek gelirse ben ona kat kat fazlasıyla sevap ile gelirim."},{"k":"li","x":"Âlimler müşkil ve muhtelefü'l-hadis ilimlerini ayırmayıp tek kitapta toplamışlardır."},{"k":"h","x":"Eserler"},{"k":"n","n":1,"x":"**Te'vîlü Muhtelifi'l-Hadîs** → İbn Kuteybe"},{"k":"n","n":2,"x":"**Müşkilü'l-Hadîs ve Beyânuh** → İbn Fûrek"},{"k":"n","n":3,"x":"**Müşkilü'l-Âsâr** → Tahâvî"}]},{"h":"Musahhaf ve Muharref","b":[{"k":"li","x":"Cümledeki yazım biçimi aynı olması ile beraber harflerde meydana gelen değişikliktir."},{"k":"d","t":"Musahhaf","x":"Değişiklik noktalamada olursa musahhaf denir."},{"k":"d","t":"Muharref","x":"Değişiklik şekilde yani kelimede olursa muharref denir."},{"k":"h","x":"Kısımları"},{"k":"li","x":"**Mana ile:** Aneze kabilesinden olan kişinin \"aneze\" kelimesini kendi kabile ismi zannetmesi. Hâlbuki hadiste geçen \"aneze\" sütre maksadı ile dikilen küçük bir mızraktır."},{"k":"li","x":"**His ile – görme:** «مراجم» yerine «مزاحم» denilmesi."},{"k":"li","x":"**His ile – duyma:** «عاصم الأحول» yerine «واصل الأحدب» denilmesi."},{"k":"li","x":"Her iki kısımda hem senette hem de metinde meydana gelebilir."},{"k":"h","x":"Tashîfin hükmü"},{"k":"li","x":"Tashîfe itimat, özellikle de metindekine mümkün değildir. Muradın anlaşılması, hükümlerin ikrar edilmesi ve bilinmesi için araştırma yapılmalıdır."},{"k":"li","x":"Tashîf genelde kitaptan alan kişilerde meydana gelir. Çok olmadığı müddetçe ravinin zabtına zarar vermez."},{"k":"h","x":"Eserler"},{"k":"n","n":1,"x":"**et-Tashîf ve't-Tahrîf** → Hasan b. Abdullah el-Askerî"},{"k":"n","n":2,"x":"**Islâhu Galati'l-Muhaddisîn** → Hamd b. Muhammed b. Ebî Süleyman"}]}]},{"t":"Cerh ve Ta'dil İlmi","intro":"Rivayet ehliyeti, adalet ve zabt; ravinin cerh sebepleri (fısk, bid'at, ihtilat); cerh-ta'dil kaideleri, mertebeleri ve eserleri.","s":[{"h":"Temel kavramlar","b":[{"k":"d","t":"Rivayet Ehliyeti (Edâ)","x":"Rivayeti aktarma ehliyeti. \"Şeyh\" olabilme ehliyeti de denilebilir. Adalet ve zabt sahibi olması gerekir."},{"k":"d","t":"Adalet","x":"Kişiyi takvalı olmaya ve şahsiyet sahibi olmaya sevk eden bir hissiyattır."},{"k":"d","t":"Adl","x":"Müslüman, baliğ, âkil, fısk ve mürûeti yaralayan şeylerden uzak duran kişidir."},{"k":"li","x":"**Mürûeti yaralayan şeyler:** Bayağılık (basit şeylere tenezzül edecek kadar basitleşmiş; değeri düşük bir şeyi çalmak) ve başkalarının küçümsediği hal ve hareketler (başkaları tarafından küçük görülerek garipsenen davranışlar sergilemek; fazla mizah ve yola bevletmek)."},{"k":"d","t":"Zabt","x":"Rivayetlerini, gaflette olmayıp uyanık olmasıyla sağlam bir şekilde koruyan kişidir."},{"k":"li","x":"Hafızasından rivayet ediyorsa hafız, kitabından zikrediyorsa zabıt ve manen rivayet ediyorsa o kelimelerin manasını iyi bilmesi gerekir."},{"k":"d","t":"Zabt-ı Sadr","x":"Ravinin işitip ezberlediği hadisleri tahammül vaktinden edâ vaktine kadar aklında tutabilmesidir."},{"k":"d","t":"Zabt-ı Kitâbet","x":"Tedvin ettiği hadis kitabını tahammül vaktinden edâ vaktine kadar tağyir-tebdil-ziyade-noksanlıktan korumasıdır."}]},{"h":"Cerh sebepleri","b":[{"k":"d","t":"Fâsık","x":"Büyük günah işleyen veya küçük günahlarda ısrarcı olan kişidir. Rivayeti merduttur."},{"k":"d","t":"Mübtedi'","x":"Ehl-i sünnet ve'l-cemaat akidesine ters, muhalif bir inanca sahip kişidir. İki kısımdır."},{"k":"li","x":"**Bid'at-i mükeffira:** Hiçbir değeri olmayan ve rivayetleri merdut kişidir."},{"k":"li","x":"**Bid'at-i gayr-i mükeffira:** Mezhebinin görüşünü üstün göstermek için yalanı mübah gören ile davet ve propaganda yapıp yalanı helal görmeyenin rivayeti merduttur. Kendi halinde yaşayan bid'at ehli adalet ve zabt sahibi ise rivayeti makbuldür."},{"k":"d","t":"Muhtelit","x":"Yaşlılık, bunaklık, göz bozukluğu gibi sebeplerden dolayı aklı karışan kişidir."},{"k":"n","n":1,"x":"Aklı karışmadan önceki rivayetleri makbuldür."},{"k":"n","n":2,"x":"Aklı karıştıktan sonraki rivayetleri merduttur."},{"k":"n","n":3,"x":"Eğer rivayet zamanı bilinmiyorsa tevakkuf edilir."}]},{"h":"İbhâm ile ta'dil","b":[{"k":"li","x":"Ravinin hocasının ismini zikretmeksizin «حدّثني الثقة» ibaresiyle rivayeti aktarmasıdır. Cumhur ulemaya göre bu ta'dil kabul edilmez."},{"k":"li","x":"Bir müçtehit için denilirse bu, o mezhebin müntesipleri için bir hüccettir. Fakat başkası aleyhine hüccet olmaz."}]},{"h":"Ravinin adalet ve zabtı nasıl bilinir?","b":[{"k":"n","n":1,"x":"**Şöhret-istifâza ile:** Ehl-i ilim arasında şöhret ve detayları bilinen kimsenin araştırılmasına gerek yoktur (dört mezhep imamları gibi)."},{"k":"n","n":2,"x":"**Cerh-ta'dil imamlarının ta'dili ile:** Bu ilmi bilen âlimler bir kişiyi cerh etmedikçe adildir."},{"k":"n","n":3,"x":"Sika ravilerin rivayetleri ile kıyas ederek zabt bilinir. (Muhalefeti çoksa zabtına zarar verir ve o kişinin rivayeti hüccet olmaktan çıkar.)"}]},{"h":"Cerh ve ta'dil kaideleri","b":[{"k":"n","n":1,"x":"**Ta'dilde icmal, cerhte tafsil:** Ta'dil sebebi zikredilmeksizin kabul edilir. Cerh ise sebebi zikredilmeden kabul edilmez. Çünkü bazıları teşeddüt sahibi, bazıları da mütesahildir."},{"k":"n","n":2,"x":"**Cerh-ta'dilde tearuz:** Ravi hem cerh hem de ta'dil edilmişse öncelik cerhin kabul edilmesidir. Fakat şu şartların olması gerekir: (1) Cerh müfesser olacak. (2) Cârih müteşeddit olmayacak. (3) Ta'dil yapan kişi cerh sebebini çürütecek bir şey söylemeyecek."},{"k":"n","n":3,"x":"**Muaddil-cârihin şartları:** Cerh yapan kişi adil, uyanık ve adalet-zabt sebeplerini bilmesi gerekir. Ta'dil yapan ise yukarıdaki şartlara ek olarak takva ve vera sahibi olması, ayrıca taassup ve hevadan uzak olması gerekir."}]},{"h":"Meçhul ve mestur kişiler","b":[{"k":"d","t":"Mechûlü'l-Ayn","x":"Rivayetinde tek kalınan, cerh ve ta'dil yapılmayan hocadır. (Cumhura göre rivayeti makbul değildir.)"},{"k":"d","t":"Mechûlü'l-Hâl","x":"Mestur da denilebilir. İki veya daha fazla kişinin rivayeti bulunan, cerh ve ta'dil yapılmayan hocadır. (Bazı âlimlere göre rivayeti hüccet olabilir.)"}]},{"h":"Rivayeti etkileyen diğer durumlar","b":[{"k":"li","x":"**Eda ve tahammül yollarında tesâhül ile bilinen kimseden yapılan rivayet:** Hadisi dinlerken (rivayet ederken) gevşek davranmakla bilinen kişilerin rivayeti makbul değildir (hadis dinlerken uyuması, başka işlerle meşgul olması gibi)."},{"k":"li","x":"**Ravinin rivayetinden veya nisyanından dönmesi:** Bir sika ravi «ما رويته / هو كذب عليّ» gibi lafızlarla rivayetinden rücu etse bu hadisin merdud olması vaciptir. Diğer rivayetleri bundan etkilenmez. Sika ravi rivayet etmiş olduğu hadisi unutarak reddederse cumhur ulemaya göre onunla amel edilir."},{"k":"li","x":"**Yalandan tövbe:** Yalandan tövbe eden kişiye gelince; bu yalanı dünyalık bir şey olup da tevbe etmişse rivayeti kabul edilir. Fakat yalanı hadisle alakalı ile ise nasuh tevbesi etse bile rivayeti artık kabul edilmez."}]},{"h":"Müteahhir ulemaya göre ta'dil mertebeleri","b":[{"k":"n","n":1,"x":"Mübalağa veya «أفعل» vezni kullanılması («أوثق» gibi)"},{"k":"n","n":2,"x":"«لا يُسأل عنه» ibaresi"},{"k":"n","n":3,"x":"Tevsîke delalet eden sîganın tekidi («ثقة ثقة»)"},{"k":"n","n":4,"x":"Tevsîke delalet eden sîganın tek kullanımı («ثقة»)"},{"k":"n","n":5,"x":"«ليس به بأس — لا بأس به — صدوق — مأمون — خيار الخلق» lafızları"},{"k":"n","n":6,"x":"Cerhe en yakın mertebedeki sîgalar: «ليس ببعيد من الصواب — شيخ وسط — صدوق إن شاء الله»"}]},{"h":"Müteahhir ulemaya göre cerh mertebeleri","b":[{"k":"n","n":1,"x":"Mübalağa vezinleri kullanılması («أكذب الناس — إليه المنتهى في الكذب — هو ركن الكذب — منبع الكذب» gibi)"},{"k":"n","n":2,"x":"«دجال — كذاب — وضاع — يكذب» lafızları"},{"k":"n","n":3,"x":"Yalan ve uydurma ile itham edilen («فلان يسرق الحديث — متروك — هالك — ذاهب الحديث — لا يعتبر به»)"},{"k":"n","n":4,"x":"«فلان رُدّ حديثه — مردود الحديث — ضعيف جدا — مطروح الحديث — لا يكتب حديثه — ليس بشيء» lafızları"},{"k":"n","n":5,"x":"«فلان لا يحتجّ به — ضعّفوه — مضطرب الحديث — ضعيف — منكر الحديث» lafızları"},{"k":"n","n":6,"x":"En az zayıflık bulunan kısımdır: «فيه مقال — ضُعّف — ليس بذلك — ليس بالقوي — فيه شيء — غيره أوثق منه — سيء الحفظ — فيه نظر» lafızları"},{"k":"not","x":"Beşinci ve altıncı kısım itibar çalışması ile hasen li-ğayrihî olabilirler."}]},{"h":"Eserler","b":[{"k":"n","n":1,"x":"**es-Sikât** → İbn Hibbân el-Büstî"},{"k":"n","n":2,"x":"**Mîzânü'l-İ'tidâl** → Şemseddin ez-Zehebî"},{"k":"n","n":3,"x":"**el-Cerh ve't-Ta'dîl** → İbn Ebî Hâtim er-Râzî"},{"k":"n","n":4,"x":"**Lisânü'l-Mîzân** → İbn Hacer"},{"k":"n","n":5,"x":"**ed-Duafâü'l-Kebîr** → Ukaylî"}]}]},{"t":"Tahammül ve Edâ Yolları","intro":"Hadisin hocadan alınması (tahammül) ve aktarılması (edâ); sema, arz, icâze, münâvele, mükâtebe, i'lâm, vasiyyet ve vicâde ile icâzenin çeşitleri.","s":[{"h":"Temel kavramlar","b":[{"k":"d","t":"Tahammül","x":"Ravinin hadisi hocasından veya ravisinden alması, yani tahammül etmesidir. Tahammülde mümeyyiz olmak yeterlidir, bâliğ olma şartı yoktur."},{"k":"d","t":"Edâ","x":"Ravinin tahammül ettiği hadisi aktarmasıdır. Müeddi olan kimsede edâ ehliyetine ulaşma şartı aranır."}]},{"h":"1) Semâ","b":[{"k":"li","x":"Cumhura göre tahammül yollarından en muteber mertebe budur."},{"k":"li","x":"«حدّثنا — أخبرنا — أنبأنا — أملى علينا — سمعت — عن — قال لنا» lafızları"},{"k":"d","t":"İmlâ","x":"Muhaddisin belirli bir zamanda belirlenmiş rivayetleri almasıdır. Hoca hadis talebelerinin arasında durur ve imla ettirir, talebeler de bu hadisleri yazarlar. Daha sonra bu yazılar karşılaştırılır."},{"k":"d","t":"Gayr-i İmlâ","x":"Hocanın kitabından veya ezberinden hadisi nakletmesidir."},{"k":"li","x":"İmlâ, tahkik ve zabt açısından daha üstündür."}]},{"h":"2) Arz (Kırâat)","b":[{"k":"d","t":"Arz","x":"Talebenin hocasına hadisleri okumasıdır. Bu okumanın kitabından veya ezberinden olması arasında bir fark yoktur."},{"k":"li","x":"«قرأت — قُرِئ على فلان — أنا أسمع فأقرّ به — أخبرنا — حدّثنا قراءة عليه» lafızları"}]},{"h":"3) İcâze","b":[{"k":"d","t":"İcâze","x":"Yazılı veya sözlü yoluyla rivayet için izin almaktır."},{"k":"h","x":"İcâzenin çeşitleri"},{"k":"d","t":"İcâze Muayyenin li-Muayyenin","x":"Hocanın muayyen bir kitabını rivayet etmesi için muayyen bir şahsa veya şahıslara izin vermesidir. Cumhura göre caizdir."},{"k":"d","t":"İcâze Gayr-i Muayyenin li-Muayyenin","x":"Hocanın muayyen olmayan bir kitabını rivayet etmesi için muayyen bir şahsa veya şahıslara izin vermesidir."},{"k":"d","t":"İcâze li-Gayr-i Muayyenin","x":"Hocanın umum vasfını taşıyan gayr-i muayyen kimselere icazet vermesidir."},{"k":"d","t":"İcâze li'l-Mechûl bi'l-Mechûl","x":"Hocanın mechul kimseler için ya da mechul şeylerin rivayeti için icazet vermesidir. Sahih değil, fasittir."},{"k":"d","t":"İcâze li'l-Ma'dûm","x":"Hocanın mevcut olmayan kimseye icazet vermesidir."},{"k":"d","t":"İcâze mâ lem Yetehammelhu","x":"Hoca tahammül etmediği bir kitabı veya hadisleri ileride işittiği takdirde rivayet etmesi için birine veya birilerine icazet vermesidir. Sahih değildir."},{"k":"d","t":"İcâzetü'l-Mücâz","x":"Hocanın icazet yolu ile aldıklarını rivayet etmesi için birine icazet vermesidir. En sahih tarz budur."}]},{"h":"4) Münâvele","b":[{"k":"d","t":"Münâvele","x":"Hocanın hadislerini içeren kitabını rivayet etmesi için elden talebeye vermesidir."},{"k":"d","t":"İcâzeye Yakın Münâvele","x":"İcâze muayyenin li-muayyen gibidir. Hocanın kitabını bir talebeye vererek «هذا سماعي فاروه عني» demesidir."},{"k":"d","t":"İcâzeden Soyutlanmış Münâvele","x":"İcazetten hali olan münâveledir. Hoca talebeye kitabını verir ancak bu kitaptaki hadisleri rivayet etmesi için ona icazet verdiğini söylemez."}]},{"h":"5) Mükâtebe","b":[{"k":"d","t":"Mükâtebe","x":"Hocanın mesmuat veya merviyatından olan hadisleri, yakında veya uzakta olsun, talebesine kendi yazısıyla yazıp göndermesidir."},{"k":"li","x":"Mükâtebe de **icâzeye yakın** ve **icâzeden soyutlanmış** olarak ikiye ayrılır."}]},{"h":"6) İ'lâm","b":[{"k":"d","t":"İ'lâm","x":"Hocanın hadisi veya kitabı raviye göstererek bunların kendi semâı olduğunu bildirmesi, ancak icazetle ilgili beyanda bulunmamasıdır."}]},{"h":"7) Vasiyyet","b":[{"k":"d","t":"Vasiyyet","x":"Hocanın rivayet ettiği bir kitabı, ölümünden veya seyahate çıkmadan evvel birisine vasiyet etmesi anlamında kullanılan bir tabirdir."},{"k":"li","x":"İbnü's-Salâh ve Nevevî'ye göre muteber değildir."}]},{"h":"8) Vicâde","b":[{"k":"d","t":"Vicâde","x":"Bulunan bir sahife veya kitaptan semâ, icâzet ve münâvele olmaksızın hadis alıp rivayet etmektir."}]}]}];

cerh lafzında ravinin diğer rivayetleri de terk edilir?","a":["«منكر الحديث»","«روى المناكير»","«يروي أحاديث منكرة»","«صدوق»"],"x":"«روى المناكير» ve «يروي أحاديث منكرة» denilen ravinin diğer rivayetleri terk edilmez; «منكر الحديث» denilenin ise diğer rivayetleri de terk edilir."},{"u":9,"q":"Muzdarib hadis konusundaki tek eser hangisidir?","a":["İbn Hacer'in el-Muktarib fî Beyâni'l-Muztarib'i","Dârekutnî'nin el-İlel'i","Suyûtî'nin el-Medrec'i","Hatîb'in el-Fasl li'l-Vasl'ı"],"x":"Kaynakta muzdarib hakkındaki tek eserin İbn Hacer'in el-Muktarib fî Beyâni'l-Muztarib'i olduğu belirtilir."},{"u":9,"q":"Hz. Enes'ten rivayet edilen meşhur besmele hadisi neye örnektir?","a":["Metinde muzdarib","Senette muzdarib","Metinde müdrec","Senette maklûb"],"x":"Kaynakta metinde muzdarib örneği olarak Hz. Enes'ten rivayet edilen besmele hadisi verilir."},{"u":9,"q":"Muallel hadisin şartları nelerdir?","a":["Kusurun gizli ve zedeleyici olması","Kusurun açık ve zedeleyici olması","Kusurun gizli ve zedeleyici olmaması","Senedin munkatı olması"],"x":"Muallelin şartları: kusurun gizli olması ve zedeleyici olması. Kusur açık olursa munkatı gibi olur."},{"u":9,"q":"Muallel hadis bahsinde \"Cahillere göre bizim bildiklerimiz kehanet hükmündedir\" diyen âlim kimdir?","a":["İbn Kesîr","İbn Hacer","Ali b. Medînî","Dârekutnî"],"x":"Muallel hadisin tanıma yollarından sonra İbn Kesîr'in bu sözü aktarılır."},{"u":9,"q":"Şazzı \"sikanın teferrüt ettiği hadis\" diye tanımlayan (muhalefet şartını aramayan) âlim kimdir?","a":["Hâkim","İbn Dakîkü'l-Îd","İbnü's-Salâh","İmam Müslim"],"x":"Hâkim'e göre şaz sikanın teferrüt ettiği hadistir; Halîlî'ye göre sika olsun olmasın bir ravinin teferrüdüdür. İkisinde de muhalefet şartı eksiktir."},{"u":10,"q":"Hadis uyduranın mürtet olduğunu söyleyen âlim kimdir?","a":["İmam Cüveynî","İbnü'l-Cevzî","Suyûtî","Ali el-Kârî"],"x":"İmam Cüveynî'ye göre hadis uyduran mürtettir; cumhura göre helal görmediği takdirde mürtet değil fasıktır."},{"u":10,"q":"Mevzu hadisi rivayet etmek hangi durumda sakıncalı değildir?","a":["Mevzu olduğunu bildirmek için aktarıyorsa","Teşvik ve korkutma amacıyla aktarıyorsa","Sadece fazilet konusunda aktarıyorsa","Senedini zikrederek aktarıyorsa"],"x":"Mevzu hadisi bile bile rivayet etmek haramdır; fakat mevzu olduğunu bildirmek için aktarmakta sıkıntı yoktur."},{"u":10,"q":"«لو أحسن أحدكم الظن بحجر لنفعه» uydurmasının sebebi olarak kaynakta hangisi gösterilir?","a":["İslam'a ilave (zındıkların kini)","Nüfuzlu kişilere yanaşmak","Kıssa yoluyla kazanç","Doğruya rücu etmekten kibirlenmek"],"x":"Zındıklar İslam'a karşı içlerindeki kinden dolayı ilave yaparlar; kaynakta bu söz örnek verilir."},{"u":10,"q":"\"Küçük bir günaha büyük bir azap\" vaadi uydurma hadisi bilme yollarından hangisine girer?","a":["Mübalağalı karşılıklar","Mana düşüklüğü","Hisse ve müşahedeye ters düşmesi","Uyduranın ikrarı"],"x":"Küçük günaha büyük azap ya da küçük amele büyük ödül, mübalağalı karşılıklar kısmındandır."},{"u":10,"q":"Tenzîhü'ş-Şerîati'l-Merfûa adlı eserin müellifi kimdir?","a":["İbn Irâk","Suyûtî","İbnü'l-Cevzî","Ali el-Kârî"],"x":"İbn Irâk'ın eseri ale'l-ebvâb düzenlenmiş ve 3 fasıldan oluşur."},{"u":10,"q":"Suyûtî'nin el-Leâli'l-Masnûa adlı eseri hangi eserin muhtasarıdır?","a":["İbnü'l-Cevzî'nin el-Mevzûât'ı","el-Cûzekânî'nin el-Ebâtîl'i","İbn Irâk'ın Tenzîhü'ş-Şerîa'sı","Ali el-Kârî'nin el-Mevzûâtü'l-Kübrâ'sı"],"x":"el-Leâli'l-Masnûa İbnü'l-Cevzî'nin eserinin muhtasarıdır; Zeylü'l-Leâlî ise İbnü'l-Cevzî'nin almadığı mevzuları toplar."},{"u":10,"q":"Uydurmaya karşı rivayette tesebbüt (ihtiyat) ne zaman başlamıştır?","a":["Hz. Osman zamanındaki fitnelerden dolayı erken dönemde","Hicri 4. asırda tasnif döneminde","Ömer b. Abdülaziz'in tedvin emriyle","İbnü's-Salâh'ın Mukaddime'sinden sonra"],"x":"Hz. Osman zamanındaki fitnelerden dolayı bu ihtiyat erken dönemde başlamıştır."},{"u":11,"q":"Müdrec hadiste idrac en çok nerede meydana gelir?","a":["Metinde","Senette","Sahabe tabakasında","Hadisin başında"],"x":"Çoğu idrac
